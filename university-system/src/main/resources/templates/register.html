<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
 
<head th:replace="~{fragments :: head('Register – Creativa')}"></head>
 
<body class="bg-background text-foreground min-h-screen flex flex-col">
    <nav th:replace="~{fragments :: navbar}"></nav>
 
    <div class="flex-1 flex items-center justify-center px-4 pt-24 pb-16">
        <div class="w-full max-w-md animate-fade-in-up">
 
            <div class="text-center mb-10">
                <div class="w-16 h-16 rounded-2xl bg-gradient-to-br from-teal-600 to-teal-800 flex items-center justify-center mx-auto mb-4 shadow-[0_0_30px_rgba(15,118,110,0.4)]">
                    <i data-lucide="graduation-cap" class="w-8 h-8 text-white"></i>
                </div>
                <h1 class="text-3xl font-bold font-heading">Student Registration</h1>
                <p class="text-muted mt-2 text-sm">Create your Creativa student account</p>
            </div>
 
            <div id="errorBox" class="hidden mb-6 bg-red-500/10 border border-red-500/30 text-red-400 p-4 rounded-2xl flex items-center gap-3">
                <i data-lucide="alert-circle" class="w-5 h-5 flex-shrink-0"></i>
                <span class="text-sm font-medium" id="errorMsg">Registration failed.</span>
            </div>
 
            <div class="glass rounded-3xl border border-subtle p-8">
                <div class="space-y-4" id="regForm">
 
                    <div>
                        <label class="block text-sm font-medium text-secondary mb-2">Full Name</label>
                        <input type="text" id="name" required placeholder="e.g. Ahmed Hassan"
                               class="w-full px-4 py-3 bg-glass border border-subtle rounded-xl text-foreground placeholder-gray-600 focus:border-teal-500/50 focus:ring-1 focus:ring-teal-500/50 outline-none transition text-sm">
                    </div>
 
                    <div>
                        <label class="block text-sm font-medium text-secondary mb-2">Email Address</label>
                        <input type="email" id="email" required placeholder="you@university.edu"
                               class="w-full px-4 py-3 bg-glass border border-subtle rounded-xl text-foreground placeholder-gray-600 focus:border-teal-500/50 focus:ring-1 focus:ring-teal-500/50 outline-none transition text-sm">
                    </div>
 
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-secondary mb-2">Major</label>
                            <input type="text" id="major" placeholder="e.g. Computer Science"
                                   class="w-full px-4 py-3 bg-glass border border-subtle rounded-xl text-foreground placeholder-gray-600 focus:border-teal-500/50 focus:ring-1 focus:ring-teal-500/50 outline-none transition text-sm">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-secondary mb-2">Enrollment Year</label>
                            <input type="number" id="enrollmentYear" value="2026" min="2000" max="2030"
                                   class="w-full px-4 py-3 bg-glass border border-subtle rounded-xl text-foreground focus:border-teal-500/50 focus:ring-1 focus:ring-teal-500/50 outline-none transition text-sm">
                        </div>
                    </div>
 
                    <div>
                        <label class="block text-sm font-medium text-secondary mb-2">Password</label>
                        <input type="password" id="password" required placeholder="Min 6 characters"
                               class="w-full px-4 py-3 bg-glass border border-subtle rounded-xl text-foreground placeholder-gray-600 focus:border-teal-500/50 focus:ring-1 focus:ring-teal-500/50 outline-none transition text-sm">
                    </div>
 
                    <button onclick="register()" id="regBtn"
                            class="w-full py-3 bg-gradient-to-r from-teal-600 to-teal-800 hover:from-teal-500 hover:to-teal-700 text-white font-bold rounded-xl transition-all shadow-[0_0_20px_rgba(15,118,110,0.3)] flex items-center justify-center gap-2">
                        <i data-lucide="user-plus" class="w-4 h-4"></i> Create Account
                    </button>
                </div>
            </div>
 
            <div class="mt-6 text-center">
                <p class="text-sm text-muted">
                    Already have an account? <a th:href="@{/login}" class="text-teal-400 hover:text-teal-300 font-semibold transition-colors">Sign In</a>
                </p>
                <p class="text-sm text-muted mt-2">
                    Lecturer? <a th:href="@{/register/lecturer}" class="text-amber-400 hover:text-amber-300 font-semibold transition-colors">Register as Lecturer</a>
                </p>
            </div>
        </div>
    </div>
 
    <footer th:replace="~{fragments :: footer}"></footer>
 
    <script th:inline="javascript">
        async function register() {
            const btn = document.getElementById('regBtn');
            btn.disabled = true;
            btn.innerHTML = '<i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i> Creating...';
            lucide.createIcons();
 
            const body = {
                name: document.getElementById('name').value,
                email: document.getElementById('email').value,
                password: document.getElementById('password').value,
                major: document.getElementById('major').value || 'Undeclared',
                enrollmentYear: document.getElementById('enrollmentYear').value || '2026'
            };
 
            try {
                const res = await fetch('/api/auth/register/student', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(body)
                });
                const data = await res.json();
                if (res.ok) {
                    // Store JWT and redirect
                    localStorage.setItem('jwtToken', data.token);
                    // Use form login for session-based auth
                    const form = document.createElement('form');
                    form.method = 'POST';
                    form.action = '/login';
                    form.innerHTML = `
                        <input name="username" value="${body.email}">
                        <input name="password" value="${body.password}">
                        <input name="_csrf" value="" type="hidden">
                    `;
                    document.body.appendChild(form);
                    form.submit();
                } else {
                    showError(data.error || 'Registration failed. Try a different email.');
                    btn.disabled = false;
                    btn.innerHTML = '<i data-lucide="user-plus" class="w-4 h-4"></i> Create Account';
                    lucide.createIcons();
                }
            } catch (e) {
                showError('Network error. Please try again.');
                btn.disabled = false;
            }
        }
 
        function showError(msg) {
            const box = document.getElementById('errorBox');
            document.getElementById('errorMsg').textContent = msg;
            box.classList.remove('hidden');
            box.classList.add('flex');
        }
    </script>
</body>
</html>
