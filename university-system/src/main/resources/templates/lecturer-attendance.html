<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head th:replace="~{fragments :: head('Course Attendance — Creativa')}"></head>

<body class="bg-background text-foreground">
    <nav th:replace="~{fragments :: navbar}"></nav>
    <div th:replace="~{fragments :: toasts}"></div>

    <div class="min-h-screen pt-24 content-wrapper pb-16 px-4 md:pr-8">
        <div class="max-w-7xl mx-auto">
            
            <div th:if="${successMessage}" data-toast class="animate-fade-in-up bg-green-500/10 border border-green-500/30 text-green-400 p-4 rounded-2xl mb-6 flex items-center gap-3">
                <i data-lucide="check-circle" class="w-5 h-5 flex-shrink-0"></i>
                <span class="font-medium" th:text="${successMessage}">Success!</span>
            </div>

            <!-- Header -->
            <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-8">
                <div>
                    <a th:href="@{/lecturer/dashboard}" class="inline-flex items-center gap-2 text-sm text-muted hover:text-foreground transition-colors mb-2">
                        <i data-lucide="arrow-left" class="w-4 h-4"></i> Back to Dashboard
                    </a>
                    <h1 class="text-3xl font-bold font-heading">
                        Manage Attendance <span class="text-teal-400" th:text="${course.coursecode}">CODE</span>
                    </h1>
                </div>
            </div>

            <!-- Schedule Selection Form -->
            <div class="glass rounded-2xl p-6 border border-subtle mb-8">
                <form th:action="@{/lecturer/course/{id}/attendance(id=${course.id})}" method="get" class="flex flex-col sm:flex-row gap-4 items-end">
                    <div class="flex-1 w-full">
                        <label class="block text-sm font-medium text-secondary mb-2">Select Schedule</label>
                        <select name="scheduleId" class="w-full bg-glass border border-subtle rounded-xl px-4 py-2.5 text-foreground focus:outline-none focus:border-teal-500/50" required>
                            <option value="" disabled selected>-- Select a Schedule --</option>
                            <option th:each="s : ${schedules}" th:value="${s.id}" th:selected="${selectedSchedule != null && selectedSchedule.id == s.id}" th:text="${s.dayOfWeek + ' ' + s.startTime + ' - ' + s.endTime + ' (' + s.room + ')'}"></option>
                        </select>
                    </div>
                    <div class="flex-1 w-full">
                        <label class="block text-sm font-medium text-secondary mb-2">Select Date</label>
                        <input type="date" name="date" class="w-full bg-glass border border-subtle rounded-xl px-4 py-2.5 text-foreground focus:outline-none focus:border-teal-500/50" th:value="${selectedDate}" required>
                    </div>
                    <button type="submit" class="w-full sm:w-auto px-6 py-2.5 rounded-xl bg-teal-600 hover:bg-teal-700 text-white font-medium transition-all">
                        Load Students
                    </button>
                </form>
            </div>

            <!-- Attendance Marking Section -->
            <div th:if="${selectedSchedule != null}">
                <div class="glass rounded-2xl border border-subtle overflow-hidden">
                    <div class="p-6 border-b border-subtle flex items-center justify-between">
                        <h2 class="text-xl font-bold font-heading flex items-center gap-2">
                            <i data-lucide="users" class="w-5 h-5 text-teal-400"></i> Enrolled Students
                        </h2>
                    </div>
                    
                    <div th:if="${#lists.isEmpty(students)}" class="p-12 text-center">
                        <i data-lucide="users-x" class="w-12 h-12 text-muted-dark mx-auto mb-4"></i>
                        <h3 class="text-lg font-medium text-foreground">No students enrolled yet</h3>
                    </div>

                    <form th:if="${!#lists.isEmpty(students)}" th:action="@{/lecturer/course/{id}/attendance/save(id=${course.id})}" method="post">
                        <input type="hidden" name="scheduleId" th:value="${selectedSchedule.id}">
                        <input type="hidden" name="date" th:value="${selectedDate}">
                        
                        <div class="overflow-x-auto">
                            <table class="w-full text-left border-collapse">
                                <thead>
                                    <tr class="bg-glass-subtle border-b border-subtle">
                                        <th class="py-4 px-6 font-semibold text-secondary text-sm">Student ID</th>
                                        <th class="py-4 px-6 font-semibold text-secondary text-sm">Name</th>
                                        <th class="py-4 px-6 font-semibold text-secondary text-sm text-center">Status</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="student : ${students}" class="border-b border-subtle/50 hover:bg-glass/50 transition-colors">
                                        <td class="py-4 px-6 text-sm text-foreground" th:text="${student.studentId}">12345</td>
                                        <td class="py-4 px-6 text-sm text-foreground font-medium" th:text="${student.name}">John Doe</td>
                                        <td class="py-4 px-6">
                                            <div class="flex items-center justify-center gap-4">
                                                <label class="flex items-center gap-2 cursor-pointer">
                                                    <input type="radio" th:name="'status_' + ${student.id}" value="PRESENT" class="w-4 h-4 text-teal-600 bg-glass border-subtle focus:ring-teal-500" th:checked="${attendanceMap == null || attendanceMap.get(student.id) == null || attendanceMap.get(student.id) == 'PRESENT'}">
                                                    <span class="text-sm font-medium text-green-400">Present</span>
                                                </label>
                                                <label class="flex items-center gap-2 cursor-pointer">
                                                    <input type="radio" th:name="'status_' + ${student.id}" value="ABSENT" class="w-4 h-4 text-red-600 bg-glass border-subtle focus:ring-red-500" th:checked="${attendanceMap != null && attendanceMap.get(student.id) == 'ABSENT'}">
                                                    <span class="text-sm font-medium text-red-400">Absent</span>
                                                </label>
                                                <label class="flex items-center gap-2 cursor-pointer">
                                                    <input type="radio" th:name="'status_' + ${student.id}" value="EXCUSED" class="w-4 h-4 text-amber-600 bg-glass border-subtle focus:ring-amber-500" th:checked="${attendanceMap != null && attendanceMap.get(student.id) == 'EXCUSED'}">
                                                    <span class="text-sm font-medium text-amber-400">Excused</span>
                                                </label>
                                            </div>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                        <div class="p-6 bg-glass-subtle border-t border-subtle flex justify-end">
                            <button type="submit" class="px-6 py-2.5 rounded-xl bg-teal-600 hover:bg-teal-700 text-white font-medium transition-all shadow-[0_0_15px_rgba(15,118,110,0.4)] flex items-center gap-2">
                                <i data-lucide="save" class="w-4 h-4"></i> Save Attendance
                            </button>
                        </div>
                    </form>
                </div>
            </div>

        </div>
    </div>

    <footer th:replace="~{fragments :: footer}"></footer>
</body>
</html>
