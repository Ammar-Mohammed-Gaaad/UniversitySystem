<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Student Life — Creativa')}"></head>
<body class="bg-background text-foreground">
    <nav th:replace="~{fragments :: navbar}"></nav>
    <div class="min-h-screen pt-24 content-wrapper pb-16 px-4 md:pr-8">
        <div class="max-w-7xl mx-auto">
            <!-- Hero -->
            <div class="glass rounded-3xl p-10 mb-10 relative overflow-hidden border border-subtle">
                <div class="absolute top-0 right-0 w-80 h-80 bg-orange-600/15 rounded-full blur-[100px] pointer-events-none -translate-y-1/2 translate-x-1/4"></div>
                <div class="relative z-10 text-center max-w-2xl mx-auto">
                    <div class="w-20 h-20 bg-gradient-to-br from-orange-500 to-orange-800 rounded-2xl flex items-center justify-center mx-auto mb-6 shadow-[0_0_30px_rgba(249,115,22,0.3)]">
                        <i data-lucide="trophy" class="w-10 h-10 text-white"></i>
                    </div>
                    <h1 class="text-4xl md:text-5xl font-bold font-heading mb-4">Student Life</h1>
                    <p class="text-lg text-muted">Discover clubs, join communities, and attend exciting events on campus.</p>
                </div>
            </div>

            <!-- Clubs Grid -->
            <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-6">
                <h2 class="text-2xl font-bold font-heading flex items-center gap-2"><i data-lucide="users" class="w-6 h-6 text-orange-400"></i> Clubs & Organizations</h2>
                
                <!-- Category Filters -->
                <div class="flex gap-2 overflow-x-auto pb-2 custom-scrollbar" id="clubFilters">
                    <button onclick="filterClubs('all')" class="filter-btn active px-4 py-2 rounded-xl text-sm font-bold bg-orange-500/10 text-orange-400 border border-orange-500/30 whitespace-nowrap transition-all">All</button>
                    <!-- In a real app these categories would be dynamic -->
                    <button onclick="filterClubs('academic')" class="filter-btn px-4 py-2 rounded-xl text-sm font-medium text-muted hover:text-foreground border border-subtle hover:border-orange-500/30 whitespace-nowrap transition-all">Academic</button>
                    <button onclick="filterClubs('sports')" class="filter-btn px-4 py-2 rounded-xl text-sm font-medium text-muted hover:text-foreground border border-subtle hover:border-orange-500/30 whitespace-nowrap transition-all">Sports</button>
                    <button onclick="filterClubs('arts')" class="filter-btn px-4 py-2 rounded-xl text-sm font-medium text-muted hover:text-foreground border border-subtle hover:border-orange-500/30 whitespace-nowrap transition-all">Arts</button>
                    <button onclick="filterClubs('social')" class="filter-btn px-4 py-2 rounded-xl text-sm font-medium text-muted hover:text-foreground border border-subtle hover:border-orange-500/30 whitespace-nowrap transition-all">Social</button>
                </div>
            </div>
            <div th:if="${#lists.isEmpty(clubs)}" class="glass rounded-2xl p-12 text-center border border-subtle mb-10">
                <i data-lucide="users-x" class="w-12 h-12 text-muted-dark mx-auto mb-4"></i>
                <h3 class="text-lg font-medium text-foreground">No clubs yet</h3>
                <p class="text-muted text-sm mt-1">Check back soon for student organizations!</p>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 mb-10" th:if="${!#lists.isEmpty(clubs)}" id="clubsGrid">
                <a th:each="club : ${clubs}" th:href="@{/club/{id}(id=${club.id})}" th:data-category="${#strings.toLowerCase(club.category)}" class="club-card glass rounded-3xl p-6 border border-subtle hover:border-orange-500/30 transition-all duration-300 hover:-translate-y-2 hover:shadow-[0_15px_30px_rgba(249,115,22,0.15)] group relative overflow-hidden">
                    <div class="absolute inset-0 bg-gradient-to-br from-orange-500/0 to-orange-500/5 opacity-0 group-hover:opacity-100 transition-opacity"></div>
                    <div class="flex items-start justify-between mb-4 relative z-10">
                        <div class="w-14 h-14 rounded-2xl bg-gradient-to-br from-orange-500/20 to-orange-600/20 flex items-center justify-center flex-shrink-0 group-hover:scale-110 group-hover:rotate-3 transition-transform duration-300">
                            <i data-lucide="flag" class="w-7 h-7 text-orange-400"></i>
                        </div>
                        <div class="flex items-center gap-1.5 px-2.5 py-1 rounded-full bg-glass border border-subtle shadow-sm group-hover:border-orange-500/30 transition-colors">
                            <i data-lucide="users" class="w-3.5 h-3.5 text-orange-400"></i>
                            <span class="text-xs font-bold text-foreground" th:text="${club.members != null ? club.members.size() : 0}">0</span>
                        </div>
                    </div>
                    <div class="relative z-10">
                        <h3 class="font-bold text-xl text-foreground group-hover:text-orange-400 transition-colors mb-1" th:text="${club.name}">Club</h3>
                        <span class="text-[10px] font-bold uppercase tracking-wider px-2 py-0.5 rounded bg-glass-subtle border border-subtle text-secondary mb-3 inline-block" th:text="${club.category}">Category</span>
                        <p class="text-sm text-muted line-clamp-2" th:text="${club.description}">Description</p>
                    </div>
                </a>
            </div>

            <!-- Upcoming Events -->
            <h2 class="text-2xl font-bold font-heading mb-6 flex items-center gap-2"><i data-lucide="calendar-days" class="w-6 h-6 text-teal-400"></i> Upcoming Events</h2>
            <div th:if="${#lists.isEmpty(events)}" class="glass rounded-2xl p-12 text-center border border-subtle">
                <i data-lucide="calendar-x" class="w-12 h-12 text-muted-dark mx-auto mb-4"></i>
                <p class="text-muted text-sm">No upcoming events scheduled.</p>
            </div>
            <div class="relative border-l-2 border-subtle ml-7 space-y-8 pb-8 pt-4" th:if="${!#lists.isEmpty(events)}">
                <div th:each="ev : ${events}" class="relative pl-8 group">
                    <!-- Timeline Dot -->
                    <div class="absolute -left-[11px] top-6 w-5 h-5 rounded-full border-4 border-background bg-teal-500 shadow-[0_0_10px_rgba(20,184,166,0.5)] group-hover:scale-125 transition-transform duration-300"></div>
                    
                    <div class="glass rounded-3xl p-6 border border-subtle flex flex-col md:flex-row justify-between gap-6 transition-all hover:border-teal-500/30 hover:shadow-[0_10px_30px_rgba(20,184,166,0.1)]">
                        <div class="flex items-start gap-5">
                            <div class="w-16 h-16 rounded-2xl bg-gradient-to-b from-teal-600/20 to-teal-800/20 flex flex-col items-center justify-center flex-shrink-0 border border-teal-500/20 shadow-inner group-hover:-translate-y-1 transition-transform duration-300">
                                <span class="text-xl font-bold font-heading text-teal-400" th:text="${#temporals.format(ev.eventDate, 'dd')}">01</span>
                                <span class="text-[10px] uppercase text-teal-500 font-bold tracking-widest" th:text="${#temporals.format(ev.eventDate, 'MMM')}">Jan</span>
                            </div>
                            <div>
                                <h3 class="text-xl font-bold font-heading text-foreground group-hover:text-teal-400 transition-colors" th:text="${ev.title}">Event</h3>
                                <p class="text-sm text-muted mt-1" th:text="${ev.description}">Desc</p>
                                <div class="flex flex-wrap items-center gap-4 mt-3">
                                    <p class="text-xs text-muted-dark flex items-center gap-1.5"><i data-lucide="clock" class="w-3.5 h-3.5 text-teal-400/70"></i> <span th:text="${#temporals.format(ev.eventDate, 'HH:mm')}">12:00</span></p>
                                    <p class="text-xs text-muted-dark flex items-center gap-1.5"><i data-lucide="map-pin" class="w-3.5 h-3.5 text-amber-400/70"></i> <span th:text="${ev.location != null ? ev.location : 'TBD'}">Location</span></p>
                                </div>
                            </div>
                        </div>
                        <div class="flex items-center border-t md:border-t-0 border-subtle pt-4 md:pt-0">
                            <span class="inline-flex items-center gap-2 px-3 py-1.5 rounded-xl bg-orange-500/10 text-orange-400 text-xs font-bold border border-orange-500/20" th:text="${ev.club.name}">
                                <i data-lucide="shield" class="w-3.5 h-3.5"></i> Club
                            </span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <footer th:replace="~{fragments :: footer}"></footer>

    <script>
        function filterClubs(category) {
            // Update active state on buttons
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.remove('active', 'bg-orange-500/10', 'text-orange-400', 'border-orange-500/30', 'font-bold');
                btn.classList.add('text-muted', 'font-medium', 'border-subtle');
            });
            event.currentTarget.classList.add('active', 'bg-orange-500/10', 'text-orange-400', 'border-orange-500/30', 'font-bold');
            event.currentTarget.classList.remove('text-muted', 'font-medium', 'border-subtle');

            // Filter the grid
            const cards = document.querySelectorAll('.club-card');
            cards.forEach(card => {
                // If 'all' is selected, or if the card category includes the selected string (case-insensitive substring match)
                const cardCat = card.getAttribute('data-category');
                if (category === 'all' || cardCat.includes(category)) {
                    card.style.display = 'block';
                    card.style.animation = 'fadeInUp 0.3s ease forwards';
                } else {
                    card.style.display = 'none';
                }
            });
        }
    </script>
</body>
</html>
