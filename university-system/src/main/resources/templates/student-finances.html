<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments :: head('My Finances — Creativa')}"></head>

<body class="bg-background text-foreground">
    <nav th:replace="~{fragments :: navbar}"></nav>
    <div th:replace="~{fragments :: toasts}"></div>

    <div class="min-h-screen pt-24 content-wrapper pb-16 px-4 md:pr-8">
        <div class="max-w-4xl mx-auto">

            <!-- Success/Error Flash -->
            <div th:if="${successMessage}" data-toast class="animate-fade-in-up bg-green-500/10 border border-green-500/30 text-green-400 p-4 rounded-2xl mb-8 flex items-center gap-3 shadow-[0_0_20px_rgba(34,197,94,0.15)]">
                <i data-lucide="check-circle" class="w-5 h-5 flex-shrink-0"></i>
                <span class="font-medium" th:text="${successMessage}">Success!</span>
            </div>

            <div class="glass rounded-3xl p-8 mb-8 relative overflow-hidden border border-subtle shadow-[0_0_30px_rgba(15,118,110,0.08)]">
                <div class="absolute top-0 right-0 w-64 h-64 bg-teal-600/10 rounded-full blur-[80px] pointer-events-none -translate-y-1/2 translate-x-1/3"></div>
                <div class="relative z-10 flex flex-col md:flex-row items-center justify-between gap-6">
                    <div class="flex items-center gap-4">
                        <div class="w-16 h-16 bg-gradient-to-br from-teal-600 to-teal-800 rounded-2xl flex items-center justify-center flex-shrink-0 shadow-lg shadow-teal-600/20">
                            <i data-lucide="credit-card" class="w-8 h-8 text-white"></i>
                        </div>
                        <div>
                            <h1 class="text-3xl font-bold font-heading mb-1">My Finances</h1>
                            <p class="text-muted text-sm">Manage your tuition and fees</p>
                        </div>
                    </div>
                    <div class="text-center md:text-right p-4 rounded-2xl bg-glass border border-subtle">
                        <p class="text-xs text-muted mb-1 uppercase tracking-wider">Total Outstanding Balance</p>
                        <p class="text-3xl font-bold font-mono" th:classappend="${totalDue > 0 ? 'text-red-400' : 'text-green-400'}" th:text="${'$' + totalDue}">$0.00</p>
                    </div>
                </div>
            </div>

            <div class="glass rounded-3xl border border-subtle overflow-hidden">
                <div class="p-6 border-b border-subtle bg-glass-subtle">
                    <h2 class="text-xl font-bold font-heading flex items-center gap-2">
                        <i data-lucide="file-text" class="w-5 h-5 text-teal-400"></i> My Invoices
                    </h2>
                </div>
                
                <div th:if="${#lists.isEmpty(invoices)}" class="p-12 text-center">
                    <i data-lucide="check-circle" class="w-12 h-12 text-green-500 mx-auto mb-4 opacity-80"></i>
                    <h3 class="text-lg font-medium text-foreground">You're all caught up!</h3>
                    <p class="text-muted text-sm mt-1">You have no invoices or pending balances.</p>
                </div>

                <div th:if="${!#lists.isEmpty(invoices)}" class="p-6 space-y-4">
                    <div th:each="inv : ${invoices}" class="glass rounded-2xl p-6 border border-subtle flex flex-col md:flex-row justify-between gap-6 transition-all hover:border-teal-500/30">
                        <div class="flex-1">
                            <div class="flex items-center gap-3 mb-2">
                                <h3 class="font-bold text-foreground text-lg" th:text="${inv.description}">Tuition</h3>
                                <span th:if="${inv.status.name() == 'PENDING'}" class="px-2.5 py-1 rounded-md text-[10px] font-bold uppercase tracking-wider bg-amber-500/10 text-amber-400 border border-amber-500/20">Pending</span>
                                <span th:if="${inv.status.name() == 'PAID'}" class="px-2.5 py-1 rounded-md text-[10px] font-bold uppercase tracking-wider bg-green-500/10 text-green-400 border border-green-500/20">Paid</span>
                            </div>
                            <p class="text-sm text-muted flex items-center gap-2">
                                <i data-lucide="calendar" class="w-4 h-4 text-secondary"></i> Due by <span class="text-foreground font-medium" th:text="${#temporals.format(inv.dueDate, 'dd MMM yyyy')}">Date</span>
                            </p>
                        </div>
                        
                        <div class="flex items-center gap-6 justify-between md:justify-end border-t md:border-t-0 border-subtle pt-4 md:pt-0">
                            <div class="text-left md:text-right">
                                <p class="text-xs text-muted mb-1">Amount</p>
                                <p class="text-2xl font-bold font-mono text-foreground" th:text="${'$' + inv.amount}">$1500.00</p>
                            </div>
                            
                            <div th:if="${inv.status.name() == 'PENDING'}">
                                <!-- Dummy Payment Form -->
                                <form th:action="@{/student/finances/pay}" method="post">
                                    <input type="hidden" name="invoiceId" th:value="${inv.id}">
                                    <input type="hidden" name="amount" th:value="${inv.amount}">
                                    <button type="submit" class="px-6 py-3 rounded-xl bg-teal-600 hover:bg-teal-700 text-white font-medium transition-all shadow-[0_0_15px_rgba(15,118,110,0.3)] flex items-center gap-2">
                                        <i data-lucide="credit-card" class="w-4 h-4"></i> Pay Now
                                    </button>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <footer th:replace="~{fragments :: footer}"></footer>
</body>
</html>
