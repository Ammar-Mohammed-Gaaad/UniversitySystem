<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments :: head('Admin Finances — Creativa')}"></head>

<body class="bg-background text-foreground">
    <nav th:replace="~{fragments :: navbar}"></nav>
    <div th:replace="~{fragments :: toasts}"></div>

    <div class="min-h-screen pt-24 content-wrapper pb-16 px-4 md:pr-8">
        <div class="max-w-7xl mx-auto">

            <!-- Success/Error Flash -->
            <div th:if="${successMessage}" data-toast class="animate-fade-in-up bg-green-500/10 border border-green-500/30 text-green-400 p-4 rounded-2xl mb-8 flex items-center gap-3 shadow-[0_0_20px_rgba(34,197,94,0.15)]">
                <i data-lucide="check-circle" class="w-5 h-5 flex-shrink-0"></i>
                <span class="font-medium" th:text="${successMessage}">Success!</span>
            </div>

            <div class="flex items-center gap-3 mb-8">
                <div class="w-12 h-12 rounded-xl flex items-center justify-center bg-gradient-to-br from-teal-600 to-teal-800 shadow-[0_0_20px_rgba(15,118,110,0.3)]">
                    <i data-lucide="dollar-sign" class="w-6 h-6 text-foreground"></i>
                </div>
                <div>
                    <h1 class="text-3xl font-bold font-heading">Financial Management</h1>
                    <p class="text-sm text-muted">Generate and manage student invoices</p>
                </div>
            </div>

            <!-- Summary Cards (NEW) -->
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-10 animate-fade-in-up delay-100">
                <div class="glass p-6 rounded-3xl border border-subtle flex items-center justify-between card-hover">
                    <div>
                        <p class="text-xs text-muted mb-1 uppercase tracking-wider">Total Revenue</p>
                        <p class="text-2xl font-bold font-heading text-teal-400" th:text="'$' + ${totalRevenue != null ? totalRevenue : '0.00'}">$0.00</p>
                    </div>
                    <div class="w-10 h-10 rounded-xl bg-teal-600/20 flex items-center justify-center">
                        <i data-lucide="trending-up" class="w-5 h-5 text-teal-400"></i>
                    </div>
                </div>
                <div class="glass p-6 rounded-3xl border border-subtle flex items-center justify-between card-hover">
                    <div>
                        <p class="text-xs text-muted mb-1 uppercase tracking-wider">Pending</p>
                        <p class="text-2xl font-bold font-heading text-amber-400" th:text="${pendingCount != null ? pendingCount : '0'}">0</p>
                    </div>
                    <div class="w-10 h-10 rounded-xl bg-amber-600/20 flex items-center justify-center">
                        <i data-lucide="clock" class="w-5 h-5 text-amber-400"></i>
                    </div>
                </div>
                <div class="glass p-6 rounded-3xl border border-subtle flex items-center justify-between card-hover">
                    <div>
                        <p class="text-xs text-muted mb-1 uppercase tracking-wider">Overdue</p>
                        <p class="text-2xl font-bold font-heading text-red-400" th:text="${overdueCount != null ? overdueCount : '0'}">0</p>
                    </div>
                    <div class="w-10 h-10 rounded-xl bg-red-600/20 flex items-center justify-center">
                        <i data-lucide="alert-triangle" class="w-5 h-5 text-red-400"></i>
                    </div>
                </div>
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
                
                <!-- Invoice Form -->
                <div class="lg:col-span-1">
                    <div class="glass rounded-3xl p-6 border border-subtle sticky top-24">
                        <h2 class="text-lg font-bold font-heading mb-6 flex items-center gap-2">
                            <i data-lucide="file-plus" class="w-5 h-5 text-teal-400"></i> Generate Invoice
                        </h2>
                        <form th:action="@{/admin/finances/invoice}" method="post" class="space-y-4">
                            <div>
                                <label class="block text-xs font-medium text-secondary mb-1.5 uppercase tracking-wider">Select Student</label>
                                <select name="studentId" required class="w-full bg-card border border-subtle rounded-xl px-4 py-2.5 text-foreground focus:border-teal-500/50 focus:ring-1 focus:ring-teal-500/50 outline-none">
                                    <option value="" disabled selected>-- Choose a student --</option>
                                    <option th:each="s : ${students}" th:value="${s.iD}" th:text="${s.name + ' (' + s.studentId + ')'}"></option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-xs font-medium text-secondary mb-1.5 uppercase tracking-wider">Description</label>
                                <input type="text" name="description" required placeholder="e.g. Fall 2026 Tuition" class="w-full bg-card border border-subtle rounded-xl px-4 py-2.5 text-foreground placeholder-gray-600 focus:border-teal-500/50 focus:ring-1 focus:ring-teal-500/50 outline-none">
                            </div>
                            <div>
                                <label class="block text-xs font-medium text-secondary mb-1.5 uppercase tracking-wider">Amount ($)</label>
                                <input type="number" step="0.01" name="amount" required placeholder="1500.00" class="w-full bg-card border border-subtle rounded-xl px-4 py-2.5 text-foreground placeholder-gray-600 focus:border-teal-500/50 focus:ring-1 focus:ring-teal-500/50 outline-none">
                            </div>
                            <div>
                                <label class="block text-xs font-medium text-secondary mb-1.5 uppercase tracking-wider">Due Date</label>
                                <input type="date" name="dueDate" required class="w-full bg-card border border-subtle rounded-xl px-4 py-2.5 text-foreground focus:border-teal-500/50 focus:ring-1 focus:ring-teal-500/50 outline-none">
                            </div>
                            
                            <button type="submit" class="w-full py-3 mt-4 bg-gradient-to-r from-teal-600 to-teal-800 hover:from-teal-500 hover:to-teal-700 text-white rounded-xl font-bold transition-all shadow-[0_0_15px_rgba(15,118,110,0.3)] flex justify-center gap-2">
                                <i data-lucide="send" class="w-4 h-4"></i> Issue Invoice
                            </button>
                        </form>
                    </div>
                </div>

                <!-- Invoice List -->
                <div class="lg:col-span-2">
                    <div class="glass rounded-3xl p-6 border border-subtle overflow-hidden">
                        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-6">
                            <h3 class="text-lg font-bold font-heading flex items-center gap-2">
                                <i data-lucide="file-text" class="w-5 h-5 text-teal-400"></i> All Invoices
                            </h3>
                            <div class="flex bg-glass p-1 rounded-xl border border-subtle">
                                <button onclick="filterInvoices('ALL')" class="filter-btn active px-3 py-1.5 text-xs font-bold rounded-lg transition-all" data-status="ALL">ALL</button>
                                <button onclick="filterInvoices('PAID')" class="filter-btn px-3 py-1.5 text-xs font-bold rounded-lg transition-all" data-status="PAID">PAID</button>
                                <button onclick="filterInvoices('PENDING')" class="filter-btn px-3 py-1.5 text-xs font-bold rounded-lg transition-all" data-status="PENDING">PENDING</button>
                            </div>
                        </div>

                        <div class="overflow-x-auto">
                            <table class="w-full text-left text-sm text-muted" id="invoiceTable">
                                <thead class="text-xs uppercase bg-glass text-secondary">
                                    <tr>
                                        <th class="px-4 py-3 rounded-tl-lg">Student / Description</th>
                                        <th class="px-4 py-3 text-right">Amount</th>
                                        <th class="px-4 py-3">Due Date</th>
                                        <th class="px-4 py-3 text-center rounded-tr-lg">Status</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="inv : ${invoices}" class="invoice-row border-b border-subtle hover:bg-glass transition-colors" th:data-status="${inv.status.name()}">
                                        <td class="px-4 py-3">
                                            <div class="flex items-center gap-3">
                                                <div class="w-8 h-8 rounded-full bg-teal-500/10 flex items-center justify-center text-teal-400 border border-teal-500/20 font-bold text-[10px]" th:text="${#strings.substring(inv.student.name, 0, 1)}">S</div>
                                                <div>
                                                    <p class="font-bold text-foreground text-sm" th:text="${inv.student.name}">Name</p>
                                                    <p class="text-xs text-muted-dark" th:text="${inv.description}">Description</p>
                                                </div>
                                            </div>
                                        </td>
                                        <td class="px-4 py-3 font-mono font-bold text-teal-400 text-right" th:text="'$' + ${inv.amount}">$0.00</td>
                                        <td class="px-4 py-3">
                                            <div class="flex flex-col">
                                                <span class="text-xs text-foreground font-medium" th:text="${#temporals.format(inv.dueDate, 'dd MMM yyyy')}">Date</span>
                                                <span th:if="${inv.status.name() == 'PENDING' and T(java.time.LocalDate).now().isAfter(inv.dueDate)}" 
                                                      class="text-[9px] font-bold text-red-400 uppercase tracking-tighter flex items-center gap-0.5">
                                                    <i data-lucide="alert-circle" class="w-2.5 h-2.5"></i> OVERDUE
                                                </span>
                                            </div>
                                        </td>
                                        <td class="px-4 py-3 text-center">
                                            <span th:if="${inv.status.name() == 'PENDING'}" 
                                                  class="inline-flex px-2 py-0.5 rounded-full bg-amber-500/10 text-amber-400 text-[10px] font-bold uppercase tracking-wider border border-amber-500/20"
                                                  th:classappend="${T(java.time.LocalDate).now().isAfter(inv.dueDate) ? 'bg-red-500/10 text-red-400 border-red-500/20' : ''}">
                                                Pending
                                            </span>
                                            <span th:if="${inv.status.name() == 'PAID'}" class="inline-flex px-2 py-0.5 rounded-full bg-green-500/10 text-green-400 text-[10px] font-bold uppercase tracking-wider border border-green-500/20">Paid</span>
                                        </td>
                                    </tr>
                                    <tr th:if="${#lists.isEmpty(invoices)}">
                                        <td colspan="4" class="px-4 py-12 text-center text-muted-dark">
                                            <i data-lucide="file-x" class="w-12 h-12 mx-auto mb-4 opacity-20"></i>
                                            <p>No invoices generated yet.</p>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <footer th:replace="~{fragments :: footer}"></footer>
    <script>
        function filterInvoices(status) {
            // Update buttons
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.remove('active', 'bg-teal-500/10', 'text-teal-400');
                if (btn.getAttribute('data-status') === status) {
                    btn.classList.add('active', 'bg-teal-500/10', 'text-teal-400');
                }
            });

            // Filter rows
            document.querySelectorAll('.invoice-row').forEach(row => {
                if (status === 'ALL' || row.getAttribute('data-status') === status) {
                    row.style.display = '';
                } else {
                    row.style.display = 'none';
                }
            });
        }
    </script>
</body>
</html>
