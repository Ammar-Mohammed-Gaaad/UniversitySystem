<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments :: head('Admin Library — Creativa')}"></head>

<body class="bg-background text-foreground">
    <nav th:replace="~{fragments :: navbar}"></nav>
    <div th:replace="~{fragments :: toasts}"></div>

    <div class="min-h-screen pt-24 content-wrapper pb-16 px-4 md:pr-8">
        <div class="max-w-7xl mx-auto">

            <!-- Flash -->
            <div th:if="${successMessage}" data-toast class="animate-fade-in-up bg-green-500/10 border border-green-500/30 text-green-400 p-4 rounded-2xl mb-8 flex items-center gap-3">
                <i data-lucide="check-circle" class="w-5 h-5 flex-shrink-0"></i>
                <span class="font-medium" th:text="${successMessage}">Success!</span>
            </div>

            <div class="flex items-center gap-3 mb-8">
                <div class="w-12 h-12 rounded-xl flex items-center justify-center bg-gradient-to-br from-indigo-600 to-indigo-800 shadow-[0_0_20px_rgba(79,70,229,0.3)]">
                    <i data-lucide="library" class="w-6 h-6 text-white"></i>
                </div>
                <div>
                    <h1 class="text-3xl font-bold font-heading">Library Management</h1>
                    <p class="text-sm text-muted">Add books and manage active loans</p>
                </div>
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
                
                <!-- Add Book Form -->
                <div class="lg:col-span-1">
                    <div class="glass rounded-3xl p-6 border border-subtle sticky top-24">
                        <h2 class="text-lg font-bold font-heading mb-6 flex items-center gap-2">
                            <i data-lucide="book-plus" class="w-5 h-5 text-indigo-400"></i> Add New Book
                        </h2>
                        <form th:action="@{/admin/library/add}" method="post" class="space-y-4">
                            <div>
                                <label class="block text-xs font-medium text-secondary mb-1.5 uppercase tracking-wider">Book Title</label>
                                <input type="text" name="title" required placeholder="e.g. Introduction to Algorithms" class="w-full bg-card border border-subtle rounded-xl px-4 py-2.5 text-foreground placeholder-gray-600 focus:border-indigo-500/50 focus:ring-1 focus:ring-indigo-500/50 outline-none">
                            </div>
                            <div>
                                <label class="block text-xs font-medium text-secondary mb-1.5 uppercase tracking-wider">Author</label>
                                <input type="text" name="author" required placeholder="e.g. Thomas H. Cormen" class="w-full bg-card border border-subtle rounded-xl px-4 py-2.5 text-foreground placeholder-gray-600 focus:border-indigo-500/50 focus:ring-1 focus:ring-indigo-500/50 outline-none">
                            </div>
                            <div>
                                <label class="block text-xs font-medium text-secondary mb-1.5 uppercase tracking-wider">ISBN</label>
                                <input type="text" name="isbn" required placeholder="e.g. 978-0262033848" class="w-full bg-card border border-subtle rounded-xl px-4 py-2.5 text-foreground placeholder-gray-600 focus:border-indigo-500/50 focus:ring-1 focus:ring-indigo-500/50 outline-none">
                            </div>
                            <div class="grid grid-cols-2 gap-4">
                                <div>
                                    <label class="block text-xs font-medium text-secondary mb-1.5 uppercase tracking-wider">Category</label>
                                    <input type="text" name="category" required placeholder="Computer Science" class="w-full bg-card border border-subtle rounded-xl px-4 py-2.5 text-foreground placeholder-gray-600 focus:border-indigo-500/50 focus:ring-1 focus:ring-indigo-500/50 outline-none">
                                </div>
                                <div>
                                    <label class="block text-xs font-medium text-secondary mb-1.5 uppercase tracking-wider">Quantity</label>
                                    <input type="number" name="quantity" required min="1" placeholder="5" class="w-full bg-card border border-subtle rounded-xl px-4 py-2.5 text-foreground placeholder-gray-600 focus:border-indigo-500/50 focus:ring-1 focus:ring-indigo-500/50 outline-none">
                                </div>
                            </div>
                            
                            <button type="submit" class="w-full py-3 mt-4 bg-gradient-to-r from-indigo-600 to-indigo-800 hover:from-indigo-500 hover:to-indigo-700 text-white rounded-xl font-bold transition-all shadow-[0_0_15px_rgba(79,70,229,0.3)] flex justify-center items-center gap-2">
                                <i data-lucide="plus" class="w-4 h-4"></i> Add Book to Catalog
                            </button>
                        </form>
                    </div>
                </div>

                <!-- Books and Loans -->
                <div class="lg:col-span-2 space-y-8">
                    
                    <!-- Books Table -->
                    <div class="glass rounded-3xl p-6 border border-subtle overflow-hidden">
                        <h3 class="text-lg font-bold font-heading mb-4 flex items-center gap-2">
                            <i data-lucide="books" class="w-5 h-5 text-indigo-400"></i> Catalog Overview
                        </h3>
                        <div class="overflow-x-auto">
                            <table class="w-full text-left text-sm text-muted">
                                <thead class="text-xs uppercase bg-glass text-secondary">
                                    <tr>
                                        <th class="px-4 py-3 rounded-tl-lg">Book Details</th>
                                        <th class="px-4 py-3 text-center">Total</th>
                                        <th class="px-4 py-3 text-center rounded-tr-lg">Available</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="book : ${books}" class="border-b border-subtle hover:bg-glass transition-colors">
                                        <td class="px-4 py-3">
                                            <p class="font-medium text-foreground" th:text="${book.title}">Title</p>
                                            <p class="text-xs text-muted-dark" th:text="${book.author}">Author</p>
                                            <span class="inline-block px-2 py-0.5 mt-1 rounded bg-glass-subtle border border-subtle text-[10px] uppercase text-secondary" th:text="${book.category}">Category</span>
                                        </td>
                                        <td class="px-4 py-3 text-center font-medium text-foreground" th:text="${book.totalQuantity}">0</td>
                                        <td class="px-4 py-3 text-center font-bold" 
                                            th:classappend="${book.availableQuantity > 0 ? 'text-green-400' : 'text-red-400'}"
                                            th:text="${book.availableQuantity}">0</td>
                                    </tr>
                                    <tr th:if="${#lists.isEmpty(books)}">
                                        <td colspan="3" class="px-4 py-8 text-center text-muted-dark">No books in the catalog.</td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>

                    <!-- Active Loans Table -->
                    <div class="glass rounded-3xl p-6 border border-subtle overflow-hidden">
                        <h3 class="text-lg font-bold font-heading mb-4 flex items-center gap-2">
                            <i data-lucide="book-up-2" class="w-5 h-5 text-amber-400"></i> Active Loans
                        </h3>
                        <div class="overflow-x-auto">
                            <table class="w-full text-left text-sm text-muted">
                                <thead class="text-xs uppercase bg-glass text-secondary">
                                    <tr>
                                        <th class="px-4 py-3 rounded-tl-lg">User</th>
                                        <th class="px-4 py-3">Book</th>
                                        <th class="px-4 py-3">Due Date</th>
                                        <th class="px-4 py-3 text-right rounded-tr-lg">Action</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="loan : ${loans}" th:if="${loan.status.name() == 'BORROWED'}" class="border-b border-subtle hover:bg-glass transition-colors">
                                        <td class="px-4 py-3">
                                            <p class="font-medium text-foreground" th:text="${loan.user.name}">Name</p>
                                            <p class="text-[10px] text-muted-dark uppercase tracking-wider" th:text="${loan.user.role}">Role</p>
                                        </td>
                                        <td class="px-4 py-3 font-medium text-indigo-400" th:text="${loan.book.title}">Book Title</td>
                                        <td class="px-4 py-3 text-foreground" th:text="${#temporals.format(loan.dueDate, 'dd MMM yyyy')}">Date</td>
                                        <td class="px-4 py-3 text-right">
                                            <form th:action="@{/admin/library/return}" method="post">
                                                <input type="hidden" name="loanId" th:value="${loan.id}">
                                                <button type="submit" class="px-3 py-1.5 rounded-lg bg-green-500/10 hover:bg-green-500/20 text-green-400 border border-green-500/20 transition-colors text-xs font-bold uppercase tracking-wider">
                                                    Mark Returned
                                                </button>
                                            </form>
                                        </td>
                                    </tr>
                                    <!-- Assume empty if no BORROWED status exists, simplified check -->
                                </tbody>
                            </table>
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </div>

    <footer th:replace="~{fragments :: footer}"></footer>
</body>
</html>
