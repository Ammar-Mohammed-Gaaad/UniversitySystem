<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
 
<head th:replace="~{fragments :: head('Internal Server Error — Creativa')}"></head>
 
<body class="bg-background text-foreground min-h-screen flex flex-col">
    <!-- ✅ FIX: was ~{fragments :: sidebar} which doesn't exist -->
    <nav th:replace="~{fragments :: navbar}"></nav>
 
    <div class="flex-1 flex items-center justify-center p-4">
        <div class="text-center animate-fade-in-up">
            <div class="relative w-32 h-32 mx-auto mb-8">
                <div class="absolute inset-0 bg-red-600/20 rounded-full blur-2xl animate-pulse-glow"></div>
                <div class="relative w-full h-full bg-card rounded-3xl border border-subtle flex items-center justify-center shadow-2xl shadow-red-900/20">
                    <span class="text-5xl font-bold font-heading text-red-400">500</span>
                </div>
            </div>
 
            <h1 class="text-4xl font-bold font-heading mb-4">Internal Server Error</h1>
            <p class="text-muted max-w-md mx-auto mb-8">Something went wrong on our end. We're working to fix the issue. Please try again later.</p>
 
            <div class="flex items-center justify-center gap-4">
                <button onclick="window.location.reload()" class="inline-flex items-center gap-2 px-6 py-3 bg-glass hover:bg-glass-hover text-foreground border border-subtle font-semibold rounded-xl transition-all">
                    <i data-lucide="refresh-cw" class="w-5 h-5"></i> Try Again
                </button>
                <a th:href="@{/}" class="inline-flex items-center gap-2 px-6 py-3 bg-gradient-to-r from-red-600 to-red-800 hover:from-red-500 hover:to-red-700 text-foreground font-semibold rounded-xl transition-all shadow-[0_0_20px_rgba(220,38,38,0.3)]">
                    <i data-lucide="home" class="w-5 h-5"></i> Back to Home
                </a>
            </div>
        </div>
    </div>
 
    <footer th:replace="~{fragments :: footer}"></footer>
    <div th:replace="~{fragments :: theme-toggle}"></div>
</body>
</html>
