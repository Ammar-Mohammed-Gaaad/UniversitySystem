<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments :: head('Club — Creativa')}"></head>
<body class="bg-background text-foreground">
    <nav th:replace="~{fragments :: navbar}"></nav>
    <div class="min-h-screen pt-24 content-wrapper pb-16 px-4 md:pr-8">
        <div class="max-w-4xl mx-auto">
            <div th:if="${successMessage}" class="animate-fade-in-up bg-green-500/10 border border-green-500/30 text-green-400 p-4 rounded-2xl mb-8 flex items-center gap-3">
                <i data-lucide="check-circle" class="w-5 h-5"></i><span th:text="${successMessage}"></span>
            </div>
            <a th:href="@{/student-life}" class="inline-flex items-center gap-2 px-4 py-2 rounded-xl text-sm text-muted hover:text-foreground hover:bg-glass transition-all mb-6"><i data-lucide="arrow-left" class="w-4 h-4"></i> Back</a>

            <!-- Club Header -->
            <div class="glass rounded-3xl p-8 mb-8 border border-subtle relative overflow-hidden">
                <div class="absolute top-0 right-0 w-64 h-64 bg-orange-600/10 rounded-full blur-[80px] pointer-events-none"></div>
                <div class="relative z-10 flex flex-col md:flex-row items-start gap-6">
                    <div class="w-20 h-20 bg-gradient-to-br from-orange-500 to-orange-800 rounded-2xl flex items-center justify-center flex-shrink-0 shadow-lg"><i data-lucide="flag" class="w-10 h-10 text-white"></i></div>
                    <div class="flex-1">
                        <h1 class="text-3xl font-bold font-heading mb-2" th:text="${club.name}">Club</h1>
                        <span class="inline-block px-2.5 py-1 rounded-md bg-glass-subtle border border-subtle text-xs font-bold uppercase text-secondary mb-3" th:text="${club.category}">Cat</span>
                        <p class="text-muted" th:text="${club.description}">Desc</p>
                        <p class="text-sm text-muted-dark mt-3 flex items-center gap-2"><i data-lucide="users" class="w-4 h-4"></i> <span th:text="${club.members != null ? club.members.size() : 0}">0</span> members</p>
                    </div>
                    <div sec:authorize="hasRole('STUDENT')">
                        <form th:if="${!isMember}" th:action="@{/club/{id}/join(id=${club.id})}" method="post">
                            <button type="submit" class="px-6 py-3 rounded-xl bg-orange-600 hover:bg-orange-700 text-white font-bold transition-all flex items-center gap-2"><i data-lucide="user-plus" class="w-4 h-4"></i> Join</button>
                        </form>
                        <form th:if="${isMember}" th:action="@{/club/{id}/leave(id=${club.id})}" method="post">
                            <button type="submit" class="px-6 py-3 rounded-xl bg-red-600/20 hover:bg-red-600/30 text-red-400 border border-red-500/30 font-bold transition-all flex items-center gap-2"><i data-lucide="user-minus" class="w-4 h-4"></i> Leave</button>
                        </form>
                    </div>
                </div>
            </div>

            <!-- Members -->
            <div class="glass rounded-3xl p-6 border border-subtle mb-8">
                <h2 class="text-xl font-bold font-heading mb-4 flex items-center gap-2"><i data-lucide="users" class="w-5 h-5 text-orange-400"></i> Members</h2>
                <div th:if="${club.members == null || club.members.isEmpty()}" class="p-6 text-center text-muted">No members yet.</div>
                <div class="grid grid-cols-2 md:grid-cols-3 gap-3" th:if="${club.members != null && !club.members.isEmpty()}">
                    <div th:each="m : ${club.members}" class="flex items-center gap-3 p-3 rounded-xl bg-glass border border-subtle">
                        <div class="w-9 h-9 rounded-full bg-teal-600/20 flex items-center justify-center"><i data-lucide="user" class="w-4 h-4 text-teal-400"></i></div>
                        <span class="text-sm font-medium text-foreground truncate" th:text="${m.name}">Name</span>
                    </div>
                </div>
            </div>

            <!-- Events -->
            <div class="glass rounded-3xl p-6 border border-subtle mb-8">
                <h2 class="text-xl font-bold font-heading mb-4 flex items-center gap-2"><i data-lucide="calendar-days" class="w-5 h-5 text-teal-400"></i> Events</h2>
                <div th:if="${events == null || events.isEmpty()}" class="p-6 text-center text-muted">No events scheduled.</div>
                <div class="space-y-3" th:if="${events != null && !events.isEmpty()}">
                    <div th:each="ev : ${events}" class="flex items-center gap-4 p-4 rounded-xl bg-glass border border-subtle">
                        <div class="w-12 h-12 rounded-xl bg-teal-600/10 flex flex-col items-center justify-center flex-shrink-0 border border-teal-500/20">
                            <span class="text-sm font-bold text-teal-400" th:text="${#temporals.format(ev.eventDate, 'dd')}">01</span>
                            <span class="text-[9px] uppercase text-teal-500 font-bold" th:text="${#temporals.format(ev.eventDate, 'MMM')}">Jan</span>
                        </div>
                        <div>
                            <h4 class="font-bold text-foreground" th:text="${ev.title}">Event</h4>
                            <p class="text-xs text-muted" th:text="${ev.location != null ? ev.location : 'TBD'}">Location</p>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Create Event (President or Admin) -->
            <div th:if="${isPresident}" class="glass rounded-3xl p-6 border border-subtle">
                <h2 class="text-lg font-bold font-heading mb-4 flex items-center gap-2"><i data-lucide="plus-circle" class="w-5 h-5 text-teal-400"></i> Create Event</h2>
                <form th:action="@{/club/{id}/event(id=${club.id})}" method="post" class="space-y-4">
                    <input type="text" name="title" required placeholder="Event title" class="w-full bg-card border border-subtle rounded-xl px-4 py-2.5 text-foreground placeholder-gray-600 focus:border-teal-500/50 outline-none">
                    <textarea name="description" rows="2" placeholder="Description" class="w-full bg-card border border-subtle rounded-xl px-4 py-2.5 text-foreground placeholder-gray-600 focus:border-teal-500/50 outline-none resize-none"></textarea>
                    <div class="grid grid-cols-3 gap-4">
                        <input type="date" name="eventDate" required class="bg-card border border-subtle rounded-xl px-4 py-2.5 text-foreground focus:border-teal-500/50 outline-none">
                        <input type="time" name="eventTime" class="bg-card border border-subtle rounded-xl px-4 py-2.5 text-foreground focus:border-teal-500/50 outline-none">
                        <input type="text" name="location" placeholder="Location" class="bg-card border border-subtle rounded-xl px-4 py-2.5 text-foreground placeholder-gray-600 focus:border-teal-500/50 outline-none">
                    </div>
                    <button type="submit" class="px-6 py-2.5 bg-teal-600 hover:bg-teal-700 text-white rounded-xl font-bold transition-all flex items-center gap-2"><i data-lucide="plus" class="w-4 h-4"></i> Create Event</button>
                </form>
            </div>
        </div>
    </div>
    <footer th:replace="~{fragments :: footer}"></footer>
</body>
</html>
