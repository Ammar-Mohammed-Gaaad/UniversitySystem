<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head th:replace="~{fragments :: head('Manage Exams — Creativa')}"></head>

<body class="bg-background text-foreground">
    <nav th:replace="~{fragments :: navbar}"></nav>
    <div th:replace="~{fragments :: toasts}"></div>

    <div class="min-h-screen pt-24 content-wrapper pb-16 px-4 md:pr-8">
        <div class="max-w-7xl mx-auto">
            
            <div th:if="${successMessage}" data-toast class="animate-fade-in-up bg-green-500/10 border border-green-500/30 text-green-400 p-4 rounded-2xl mb-6 flex items-center gap-3">
                <i data-lucide="check-circle" class="w-5 h-5 flex-shrink-0"></i>
                <span class="font-medium" th:text="${successMessage}">Success!</span>
            </div>

            <!-- Header -->
            <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-8">
                <div>
                    <a th:href="@{/lecturer/dashboard}" class="inline-flex items-center gap-2 text-sm text-muted hover:text-foreground transition-colors mb-2">
                        <i data-lucide="arrow-left" class="w-4 h-4"></i> Back to Dashboard
                    </a>
                    <h1 class="text-3xl font-bold font-heading">
                        Manage Exams <span class="text-teal-400" th:text="${course.coursecode}">CODE</span>
                    </h1>
                </div>
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
                
                <!-- Exam List -->
                <div class="lg:col-span-2">
                    <div class="glass rounded-2xl border border-subtle overflow-hidden">
                        <div class="p-6 border-b border-subtle flex items-center justify-between">
                            <h2 class="text-xl font-bold font-heading flex items-center gap-2">
                                <i data-lucide="file-question" class="w-5 h-5 text-teal-400"></i> Existing Exams
                            </h2>
                        </div>
                        
                        <div th:if="${#lists.isEmpty(exams)}" class="p-12 text-center">
                            <i data-lucide="inbox" class="w-12 h-12 text-muted-dark mx-auto mb-4"></i>
                            <h3 class="text-lg font-medium text-foreground">No exams created yet</h3>
                            <p class="text-muted text-sm mt-1">Create your first exam using the form.</p>
                        </div>

                        <div th:if="${!#lists.isEmpty(exams)}" class="p-6 space-y-4">
                            <div th:each="exam : ${exams}" class="glass rounded-2xl p-5 border border-subtle flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                                <div>
                                    <div class="flex items-center gap-2 mb-1">
                                        <h3 class="font-bold text-foreground text-lg" th:text="${exam.title}">Exam Title</h3>
                                        <span th:if="${exam.status.name() == 'DRAFT'}" class="px-2 py-0.5 rounded text-[10px] font-bold uppercase tracking-wider bg-secondary/10 text-secondary border border-subtle">Draft</span>
                                        <span th:if="${exam.status.name() == 'PUBLISHED'}" class="px-2 py-0.5 rounded text-[10px] font-bold uppercase tracking-wider bg-green-500/10 text-green-400 border border-green-500/20">Published</span>
                                    </div>
                                    <p class="text-sm text-muted mb-2 flex items-center gap-2">
                                        <i data-lucide="clock" class="w-3.5 h-3.5"></i> <span th:text="${exam.durationMinutes} + ' mins'">60 mins</span>
                                        <i data-lucide="calendar" class="w-3.5 h-3.5 ml-2"></i> <span th:text="${#temporals.format(exam.startTime, 'dd MMM yyyy, HH:mm')}">Date</span>
                                    </p>
                                    <p class="text-xs text-teal-400 flex items-center gap-1">
                                        <i data-lucide="check-square" class="w-3 h-3"></i> <span th:text="${subCounts.get(exam.id)} + ' Submissions'">0 Submissions</span>
                                    </p>
                                </div>
                                <div class="flex items-center gap-2 sm:flex-col lg:flex-row">
                                    <a th:href="@{/lecturer/exam/{id}(id=${exam.id})}" class="flex-1 text-center px-4 py-2 bg-glass border border-subtle hover:bg-glass-hover text-sm font-medium rounded-xl transition-colors">
                                        Manage
                                    </a>
                                    <a th:href="@{/lecturer/exam/{id}/submissions(id=${exam.id})}" class="flex-1 text-center px-4 py-2 bg-teal-600/10 border border-teal-500/20 hover:bg-teal-600/20 text-teal-400 text-sm font-medium rounded-xl transition-colors">
                                        Results
                                    </a>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Create Exam Form -->
                <div>
                    <div class="glass rounded-2xl border border-subtle overflow-hidden sticky top-24">
                        <div class="p-6 border-b border-subtle bg-glass-subtle">
                            <h2 class="text-lg font-bold font-heading flex items-center gap-2">
                                <i data-lucide="plus-circle" class="w-5 h-5 text-teal-400"></i> Create New Exam
                            </h2>
                        </div>
                        <div class="p-6">
                            <form th:action="@{/lecturer/course/{id}/exams(id=${course.id})}" method="post" class="space-y-4">
                                <div>
                                    <label class="block text-sm font-medium text-secondary mb-1.5">Exam Title</label>
                                    <input type="text" name="title" required class="w-full bg-glass border border-subtle rounded-xl px-4 py-2 text-foreground focus:outline-none focus:border-teal-500/50 placeholder:text-muted-dark" placeholder="e.g. Midterm Exam">
                                </div>
                                <div>
                                    <label class="block text-sm font-medium text-secondary mb-1.5">Description (Optional)</label>
                                    <textarea name="description" rows="2" class="w-full bg-glass border border-subtle rounded-xl px-4 py-2 text-foreground focus:outline-none focus:border-teal-500/50 resize-none"></textarea>
                                </div>
                                <div>
                                    <label class="block text-sm font-medium text-secondary mb-1.5">Start Date & Time</label>
                                    <input type="datetime-local" name="startTime" required class="w-full bg-glass border border-subtle rounded-xl px-4 py-2 text-foreground focus:outline-none focus:border-teal-500/50">
                                </div>
                                <div>
                                    <label class="block text-sm font-medium text-secondary mb-1.5">Duration (Minutes)</label>
                                    <input type="number" name="durationMinutes" required min="5" class="w-full bg-glass border border-subtle rounded-xl px-4 py-2 text-foreground focus:outline-none focus:border-teal-500/50" placeholder="60">
                                </div>
                                
                                <button type="submit" class="w-full px-4 py-2.5 rounded-xl bg-teal-600 hover:bg-teal-700 text-white font-medium transition-all shadow-[0_0_15px_rgba(15,118,110,0.3)] mt-2">
                                    Create Exam
                                </button>
                            </form>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <footer th:replace="~{fragments :: footer}"></footer>
</body>
</html>
