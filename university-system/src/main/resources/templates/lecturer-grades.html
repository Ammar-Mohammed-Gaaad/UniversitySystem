<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments :: head('Grade Management — Creativa')}"></head>

<body class="bg-background text-foreground">
    <nav th:replace="~{fragments :: navbar}"></nav>
    <div th:replace="~{fragments :: toasts}"></div>

    <div class="min-h-screen pt-24 content-wrapper pb-16 px-4 md:pr-8">
        <div class="max-w-6xl mx-auto">

            <!-- Breadcrumbs & Header -->
            <div class="mb-8">
                <nav class="flex items-center gap-2 text-sm text-muted-dark mb-4">
                    <a th:href="@{/lecturer/dashboard}" class="hover:text-secondary transition-colors">Dashboard</a>
                    <i data-lucide="chevron-right" class="w-3.5 h-3.5"></i>
                    <span class="text-teal-400 font-medium" th:text="${course.coursecode}">CODE</span>
                    <i data-lucide="chevron-right" class="w-3.5 h-3.5"></i>
                    <span class="text-secondary">Grades</span>
                </nav>
                <div class="flex items-center gap-4">
                    <div class="w-12 h-12 bg-green-600/20 rounded-xl flex items-center justify-center border border-green-500/30">
                        <i data-lucide="graduation-cap" class="w-6 h-6 text-green-400"></i>
                    </div>
                    <div>
                        <h1 class="text-3xl font-bold font-heading" th:text="'Manage Grades: ' + ${course.title}">Manage Grades</h1>
                        <p class="text-muted text-sm mt-1">Assign and update final grades for enrolled students.</p>
                    </div>
                </div>
            </div>

            <div th:if="${successMessage}" data-toast class="bg-green-500/10 border border-green-500/30 text-green-400 p-4 rounded-xl mb-6 flex items-center gap-3">
                <i data-lucide="check-circle" class="w-5 h-5"></i>
                <span th:text="${successMessage}">Success!</span>
            </div>

            <div class="glass rounded-3xl border border-subtle overflow-hidden">
                <div class="p-6 border-b border-subtle flex items-center justify-between">
                    <h3 class="text-lg font-bold font-heading">Enrolled Students (<span th:text="${#lists.size(enrollments)}">0</span>)</h3>
                </div>

                <div th:if="${#lists.isEmpty(enrollments)}" class="p-12 text-center">
                    <p class="text-muted">No students are currently enrolled in this course.</p>
                </div>

                <form th:if="${!#lists.isEmpty(enrollments)}" th:action="@{/lecturer/course/{id}/grades(id=${course.id})}" method="post" class="m-0">
                    <div class="overflow-x-auto">
                        <table class="w-full text-left text-sm whitespace-nowrap">
                            <thead class="bg-glass text-muted border-b border-subtle">
                                <tr>
                                    <th class="px-6 py-4 font-semibold w-16">#</th>
                                    <th class="px-6 py-4 font-semibold">Student Name</th>
                                    <th class="px-6 py-4 font-semibold">Student ID</th>
                                    <th class="px-6 py-4 font-semibold w-48">Final Grade</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-white/5">
                                <tr th:each="enrollment, stat : ${enrollments}" class="hover:bg-glass-subtle/50 transition-colors group">
                                    <td class="px-6 py-4 text-muted-dark font-mono text-sm" th:text="${stat.count}">1</td>
                                    <td class="px-6 py-4 font-medium text-foreground group-hover:text-green-400 transition-colors" th:text="${enrollment.student.name}">Name</td>
                                    <td class="px-6 py-4 text-muted text-sm" th:text="${enrollment.student.studentId}">STU-XXX</td>
                                    <td class="px-6 py-4">
                                        <div class="relative w-full max-w-[160px]">
                                            <select th:name="'grade_' + ${enrollment.id}" class="appearance-none bg-glass border border-subtle rounded-xl text-foreground text-sm font-bold focus:ring-2 focus:ring-green-500/50 focus:border-green-500 block w-full py-2.5 pl-4 pr-10 outline-none transition-all cursor-pointer hover:border-green-500/30">
                                            <option value="" th:selected="${enrollment.grade == null || enrollment.grade == ''}">Not Graded</option>
                                            <option value="A+" th:selected="${enrollment.grade == 'A+'}">A+ (4.0)</option>
                                            <option value="A" th:selected="${enrollment.grade == 'A'}">A (4.0)</option>
                                            <option value="A-" th:selected="${enrollment.grade == 'A-'}">A- (3.7)</option>
                                            <option value="B+" th:selected="${enrollment.grade == 'B+'}">B+ (3.3)</option>
                                            <option value="B" th:selected="${enrollment.grade == 'B'}">B (3.0)</option>
                                            <option value="B-" th:selected="${enrollment.grade == 'B-'}">B- (2.7)</option>
                                            <option value="C+" th:selected="${enrollment.grade == 'C+'}">C+ (2.3)</option>
                                            <option value="C" th:selected="${enrollment.grade == 'C'}">C (2.0)</option>
                                            <option value="C-" th:selected="${enrollment.grade == 'C-'}">C- (1.7)</option>
                                            <option value="D+" th:selected="${enrollment.grade == 'D+'}">D+ (1.3)</option>
                                            <option value="D" th:selected="${enrollment.grade == 'D'}">D (1.0)</option>
                                            <option value="F" th:selected="${enrollment.grade == 'F'}">F (0.0)</option>
                                            </select>
                                            <i data-lucide="chevron-down" class="w-4 h-4 text-muted pointer-events-none absolute right-3 top-1/2 -translate-y-1/2 group-hover:text-green-400 transition-colors"></i>
                                        </div>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                    <div class="p-6 border-t border-subtle bg-glass-subtle flex justify-end">
                        <button type="submit" class="px-6 py-2.5 bg-green-600 hover:bg-green-500 text-foreground font-semibold rounded-xl transition-colors shadow-lg shadow-green-600/20 flex items-center gap-2">
                            <i data-lucide="save" class="w-4 h-4"></i> Save All Grades
                        </button>
                    </div>
                </form>
            </div>

        </div>
    </div>

    <footer th:replace="~{fragments :: footer}"></footer>
</body>
</html>
