<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
 
<head th:replace="~{fragments :: head('My Timetable – Creativa')}"></head>
 
<body class="bg-background text-foreground">
    <nav th:replace="~{fragments :: navbar}"></nav>
 
    <div class="min-h-screen pt-24 content-wrapper pb-16 px-4 md:pr-8">
        <div class="max-w-6xl mx-auto">
 
            <!-- Header -->
            <div class="mb-8 animate-fade-in-up">
                <nav class="flex items-center gap-2 text-sm text-muted-dark mb-4">
                    <a th:href="@{/student/dashboard}" class="hover:text-secondary transition-colors">Dashboard</a>
                    <i data-lucide="chevron-right" class="w-3.5 h-3.5"></i>
                    <span class="text-teal-400 font-medium">Timetable</span>
                </nav>
                <div class="flex items-center gap-4">
                    <div class="w-12 h-12 bg-teal-600/20 rounded-xl flex items-center justify-center border border-teal-500/30">
                        <i data-lucide="calendar" class="w-6 h-6 text-teal-400"></i>
                    </div>
                    <div>
                        <h1 class="text-3xl font-bold font-heading">My Timetable</h1>
                        <p class="text-muted text-sm mt-1">Your weekly class schedule based on enrolled courses.</p>
                    </div>
                </div>
            </div>
 
            <!-- Empty State -->
            <div th:if="${schedules == null or #lists.isEmpty(schedules)}" class="glass rounded-3xl p-16 text-center border border-subtle animate-fade-in-up delay-100">
                <div class="w-16 h-16 bg-glass rounded-2xl flex items-center justify-center mx-auto mb-4">
                    <i data-lucide="calendar-x" class="w-8 h-8 text-muted-dark"></i>
                </div>
                <h3 class="text-xl font-bold mb-2">No Schedule Available</h3>
                <p class="text-muted text-sm max-w-sm mx-auto">Enroll in courses to see your weekly schedule here. Schedule is managed by your course instructors.</p>
                <a th:href="@{/courses-page}" class="mt-6 inline-flex items-center gap-2 px-5 py-2.5 bg-teal-600/20 hover:bg-teal-600/30 text-teal-400 border border-teal-500/30 rounded-xl font-medium text-sm transition-all">
                    <i data-lucide="search" class="w-4 h-4"></i> Browse Courses
                </a>
            </div>
 
            <!-- Timetable Grid -->
            <div th:if="${schedules != null and !#lists.isEmpty(schedules)}" class="animate-fade-in-up delay-100">
 
                <!-- Day Tabs -->
                <div class="flex gap-2 mb-6 overflow-x-auto pb-2">
                    <button th:each="day : ${ {'Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'} }"
                            th:onclick="|filterDay('${day}')|"
                            th:id="|btn-${day}|"
                            class="day-btn px-4 py-2 rounded-xl border border-subtle text-sm font-medium text-muted hover:text-foreground hover:border-teal-500/30 transition-all whitespace-nowrap"
                            th:text="${day}">Day</button>
                    <button onclick="filterDay('all')" id="btn-all"
                            class="day-btn px-4 py-2 rounded-xl border border-teal-500/40 bg-teal-600/15 text-teal-400 text-sm font-bold transition-all whitespace-nowrap">
                        All Days
                    </button>
                </div>
 
                <!-- Schedule Cards -->
                <div class="space-y-4" id="scheduleList">
                    <div th:each="s : ${schedules}"
                         th:data-day="${s.dayOfWeek}"
                         class="schedule-item glass rounded-2xl p-5 border border-subtle hover:border-teal-500/30 transition-all duration-300">
                        <div class="flex flex-col sm:flex-row sm:items-center gap-4">
                            <!-- Day Badge -->
                            <div class="w-24 flex-shrink-0 text-center">
                                <span class="inline-block px-3 py-1.5 rounded-xl bg-teal-600/20 border border-teal-500/30 text-xs font-bold text-teal-400 uppercase tracking-wider"
                                      th:text="${s.dayOfWeek}">Monday</span>
                            </div>
                            <!-- Time -->
                            <div class="flex items-center gap-2 text-sm text-muted flex-shrink-0">
                                <i data-lucide="clock" class="w-4 h-4 text-teal-400"></i>
                                <span th:text="${s.startTime} + ' – ' + ${s.endTime}">09:00 – 11:00</span>
                            </div>
                            <!-- Course Info -->
                            <div class="flex-1 min-w-0">
                                <p class="font-bold text-foreground" th:text="${s.course.title}">Course Title</p>
                                <p class="text-xs text-muted-dark mt-0.5" th:text="${s.course.coursecode}">CODE</p>
                            </div>
                            <!-- Room -->
                            <div th:if="${s.room != null and !s.room.isBlank()}" class="flex items-center gap-1.5 text-sm text-muted-dark flex-shrink-0">
                                <i data-lucide="map-pin" class="w-4 h-4 text-blue-400"></i>
                                <span th:text="'Room ' + ${s.room}">Room A1</span>
                            </div>
                            <!-- Lecturer -->
                            <div th:if="${s.lecturer != null}" class="flex items-center gap-1.5 text-sm text-muted-dark flex-shrink-0">
                                <i data-lucide="user" class="w-4 h-4 text-amber-400"></i>
                                <span th:text="${s.lecturer.name}">Dr. Name</span>
                            </div>
                        </div>
                    </div>
                </div>
 
            </div>
 
        </div>
    </div>
 
    <footer th:replace="~{fragments :: footer}"></footer>
 
    <script>
        function filterDay(day) {
            document.querySelectorAll('.day-btn').forEach(btn => {
                btn.classList.remove('bg-teal-600/15', 'border-teal-500/40', 'text-teal-400', 'font-bold');
                btn.classList.add('border-subtle', 'text-muted');
            });
            const active = document.getElementById('btn-' + day);
            if (active) {
                active.classList.add('bg-teal-600/15', 'border-teal-500/40', 'text-teal-400', 'font-bold');
                active.classList.remove('border-subtle', 'text-muted');
            }
 
            document.querySelectorAll('.schedule-item').forEach(item => {
                if (day === 'all' || item.getAttribute('data-day') === day) {
                    item.style.display = '';
                } else {
                    item.style.display = 'none';
                }
            });
        }
    </script>
</body>
</html>
