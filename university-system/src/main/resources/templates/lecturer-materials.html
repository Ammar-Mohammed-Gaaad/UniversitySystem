<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments :: head('Course Materials — Creativa')}"></head>

<body class="bg-background text-foreground">
    <nav th:replace="~{fragments :: navbar}"></nav>
    <div th:replace="~{fragments :: toasts}"></div>

    <div class="min-h-screen pt-24 content-wrapper pb-16 px-4 md:pr-8">
        <div class="max-w-6xl mx-auto">

            <!-- Breadcrumbs & Header -->
            <div class="mb-8 flex flex-col sm:flex-row sm:items-end justify-between gap-4">
                <div>
                    <nav class="flex items-center gap-2 text-sm text-muted-dark mb-4">
                        <a th:href="@{/lecturer/dashboard}" class="hover:text-secondary transition-colors">Dashboard</a>
                        <i data-lucide="chevron-right" class="w-3.5 h-3.5"></i>
                        <span class="text-teal-400 font-medium" th:text="${course.coursecode}">CODE</span>
                        <i data-lucide="chevron-right" class="w-3.5 h-3.5"></i>
                        <span class="text-secondary">Materials</span>
                    </nav>
                    <div class="flex items-center gap-4">
                        <div class="w-12 h-12 bg-blue-600/20 rounded-xl flex items-center justify-center border border-blue-500/30">
                            <i data-lucide="folder-down" class="w-6 h-6 text-blue-400"></i>
                        </div>
                        <div>
                            <h1 class="text-3xl font-bold font-heading" th:text="'Materials: ' + ${course.title}">Materials</h1>
                            <p class="text-muted text-sm mt-1">Upload and manage resources for your students.</p>
                        </div>
                    </div>
                </div>
            </div>

            <div th:if="${successMessage}" data-toast class="bg-green-500/10 border border-green-500/30 text-green-400 p-4 rounded-xl mb-6 flex items-center gap-3">
                <i data-lucide="check-circle" class="w-5 h-5"></i>
                <span th:text="${successMessage}">Success!</span>
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
                <!-- Main Content: Uploaded Materials -->
                <div class="lg:col-span-2 space-y-6">
                    <h2 class="text-xl font-bold font-heading">Course Resources</h2>

                    <div th:if="${#lists.isEmpty(materials)}" class="glass rounded-3xl p-12 text-center border border-subtle">
                        <div class="w-16 h-16 bg-glass rounded-2xl flex items-center justify-center mx-auto mb-4">
                            <i data-lucide="file-x" class="w-8 h-8 text-muted-dark"></i>
                        </div>
                        <h3 class="text-lg font-bold text-foreground mb-2">No Materials Yet</h3>
                        <p class="text-sm text-muted">Upload slides, documents, or links using the form.</p>
                    </div>

                    <div th:if="${!#lists.isEmpty(materials)}" class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div th:each="mat : ${materials}" class="glass rounded-2xl p-5 border border-subtle hover:border-blue-500/30 transition-colors flex flex-col h-full">
                            <div class="flex items-start gap-3 mb-3">
                                <div class="w-10 h-10 bg-blue-600/15 rounded-xl flex items-center justify-center border border-blue-500/20 flex-shrink-0">
                                    <i data-lucide="file-text" class="w-5 h-5 text-blue-400"></i>
                                </div>
                                <div>
                                    <h3 class="font-bold text-foreground leading-tight mb-1" th:text="${mat.title}">Title</h3>
                                    <p class="text-xs text-muted-dark" th:text="${#temporals.format(mat.uploadDate, 'dd MMM yyyy')}">Date</p>
                                </div>
                            </div>
                            <p class="text-sm text-muted mb-4 flex-1" th:text="${mat.description}">Description</p>
                            
                            <div class="mt-auto pt-4 border-t border-subtle">
                                <a th:if="${mat.fileUrl != null}" th:href="${mat.fileUrl}" target="_blank" class="w-full inline-flex items-center justify-center gap-2 px-4 py-2 bg-blue-600/10 hover:bg-blue-600/20 text-blue-400 border border-blue-500/30 rounded-xl transition-colors text-sm font-medium">
                                    <i data-lucide="download" class="w-4 h-4"></i> Download File
                                </a>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Sidebar: Upload New -->
                <div>
                    <div class="glass rounded-3xl p-6 border border-subtle sticky top-24">
                        <h2 class="text-lg font-bold font-heading mb-4 flex items-center gap-2">
                            <i data-lucide="upload-cloud" class="w-5 h-5 text-blue-400"></i> Upload Material
                        </h2>
                        <form th:action="@{/lecturer/course/{id}/materials(id=${course.id})}" method="post" enctype="multipart/form-data" class="space-y-4">
                            <div>
                                <label class="block text-sm font-medium text-secondary mb-1">Title</label>
                                <input type="text" name="title" required class="block w-full px-4 py-2.5 bg-glass border border-subtle rounded-xl text-foreground text-sm focus:ring-2 focus:ring-blue-500/50 outline-none">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-secondary mb-1">Description (Optional)</label>
                                <textarea name="description" rows="3" class="block w-full px-4 py-2.5 bg-glass border border-subtle rounded-xl text-foreground text-sm focus:ring-2 focus:ring-blue-500/50 outline-none"></textarea>
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-secondary mb-1">File Attachment</label>
                                <input type="file" name="file" class="block w-full text-sm text-muted file:mr-4 file:py-2.5 file:px-4 file:rounded-xl file:border-0 file:text-sm file:font-semibold file:bg-blue-600/10 file:text-blue-400 hover:file:bg-blue-600/20 focus:outline-none">
                            </div>
                            <button type="submit" class="w-full py-2.5 bg-blue-600 hover:bg-blue-500 text-foreground font-semibold rounded-xl transition-colors mt-2">
                                Upload Resource
                            </button>
                        </form>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <footer th:replace="~{fragments :: footer}"></footer>
</body>
</html>
