<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments :: head('Submissions — Creativa')}"></head>

<body class="bg-background text-foreground">
    <nav th:replace="~{fragments :: navbar}"></nav>
    <div th:replace="~{fragments :: toasts}"></div>

    <div class="min-h-screen pt-24 content-wrapper pb-16 px-4 md:pr-8">
        <div class="max-w-6xl mx-auto">

            <!-- Breadcrumbs & Header -->
            <div class="mb-8">
                <nav class="flex items-center gap-2 text-sm text-muted-dark mb-4">
                    <a th:href="@{/lecturer/dashboard}" class="hover:text-secondary transition-colors">Dashboard</a>
                    <i data-lucide="chevron-right" class="w-3.5 h-3.5"></i>
                    <a th:href="@{/lecturer/course/{id}/assignments(id=${assignment.course.id})}" class="hover:text-secondary transition-colors" th:text="${assignment.course.coursecode}">CODE</a>
                    <i data-lucide="chevron-right" class="w-3.5 h-3.5"></i>
                    <span class="text-teal-400 font-medium">Submissions</span>
                </nav>
                <div class="glass rounded-2xl p-6 border border-subtle border-l-4 border-l-amber-500">
                    <h1 class="text-2xl font-bold text-foreground mb-2" th:text="${assignment.title}">Assignment Title</h1>
                    <div class="flex gap-4 text-sm text-muted">
                        <span>Max Score: <span class="text-foreground font-medium" th:text="${assignment.maxScore}">100</span></span>
                        <span>Due: <span class="text-foreground font-medium" th:text="${#temporals.format(assignment.dueDate, 'dd MMM yyyy HH:mm')}">Date</span></span>
                    </div>
                </div>
            </div>

            <div th:if="${successMessage}" data-toast class="bg-green-500/10 border border-green-500/30 text-green-400 p-4 rounded-xl mb-6 flex items-center gap-3">
                <i data-lucide="check-circle" class="w-5 h-5"></i>
                <span th:text="${successMessage}">Success!</span>
            </div>

            <div class="glass rounded-3xl border border-subtle overflow-hidden">
                <div class="p-6 border-b border-subtle flex items-center justify-between">
                    <h3 class="text-lg font-bold font-heading">Student Submissions (<span th:text="${#lists.size(submissions)}">0</span>)</h3>
                </div>

                <div th:if="${#lists.isEmpty(submissions)}" class="p-12 text-center">
                    <p class="text-muted">No students have submitted this assignment yet.</p>
                </div>

                <div th:if="${!#lists.isEmpty(submissions)}" class="divide-y divide-white/5">
                    <div th:each="sub : ${submissions}" class="p-6 hover:bg-glass-subtle transition-colors">
                        <div class="flex flex-col md:flex-row gap-6">
                            <!-- Student Info & Submission Details -->
                            <div class="flex-1">
                                <div class="flex items-center gap-3 mb-3">
                                    <div class="w-10 h-10 bg-teal-600/20 rounded-full flex items-center justify-center border border-teal-500/30 text-teal-400 font-bold shadow-inner" th:text="${#strings.substring(sub.student.name, 0, 1)}">S</div>
                                    <div>
                                        <div class="flex items-center gap-2">
                                            <h4 class="font-bold text-foreground text-lg" th:text="${sub.student.name}">Student Name</h4>
                                            <span th:if="${sub.grade != null}" class="px-2 py-0.5 rounded text-[10px] font-bold uppercase tracking-wider bg-green-500/10 text-green-400 border border-green-500/20">Graded</span>
                                            <span th:if="${sub.grade == null}" class="px-2 py-0.5 rounded text-[10px] font-bold uppercase tracking-wider bg-amber-500/10 text-amber-400 border border-amber-500/20">Needs Grading</span>
                                        </div>
                                        <p class="text-xs text-muted-dark">ID: <span th:text="${sub.student.studentId}">STU-XXX</span> • Submitted: <span th:text="${#temporals.format(sub.submissionDate, 'dd MMM yyyy HH:mm')}">Date</span></p>
                                    </div>
                                </div>
                                
                                <div class="bg-black/20 rounded-xl p-4 border border-subtle text-secondary text-sm whitespace-pre-wrap mb-3" th:text="${sub.content != null && !sub.content.isEmpty() ? sub.content : 'No text content provided.'}">Content</div>
                                
                                <a th:if="${sub.fileUrl != null}" th:href="${sub.fileUrl}" target="_blank" class="inline-flex items-center gap-2 px-3 py-1.5 bg-blue-600/10 hover:bg-blue-600/20 text-blue-400 border border-blue-500/30 rounded-lg transition-colors text-sm">
                                    <i data-lucide="download" class="w-4 h-4"></i> Download Attachment
                                </a>
                            </div>

                            <!-- Grading Form -->
                            <div class="w-full md:w-80 bg-glass-subtle rounded-2xl p-5 border border-subtle relative overflow-hidden group hover:border-teal-500/30 transition-colors">
                                <div th:if="${sub.grade != null}" class="absolute top-0 right-0 w-24 h-24 bg-green-500/5 rounded-full blur-xl pointer-events-none -translate-y-1/2 translate-x-1/2 group-hover:bg-green-500/10 transition-colors"></div>
                                <div th:if="${sub.grade == null}" class="absolute top-0 right-0 w-24 h-24 bg-amber-500/5 rounded-full blur-xl pointer-events-none -translate-y-1/2 translate-x-1/2 group-hover:bg-amber-500/10 transition-colors"></div>
                                
                                <form th:action="@{/lecturer/submission/{id}/grade(id=${sub.id})}" method="post" class="space-y-4 relative z-10">
                                    <div class="relative">
                                        <label class="block text-[10px] font-bold uppercase tracking-wider text-muted mb-1.5">Score (Out of <span th:text="${assignment.maxScore}">100</span>)</label>
                                        <div class="relative">
                                            <input type="number" step="0.5" name="grade" th:value="${sub.grade}" required min="0" th:max="${assignment.maxScore}" 
                                                   class="block w-full px-4 py-2.5 bg-background border border-subtle rounded-xl text-foreground font-mono text-lg focus:ring-2 focus:ring-teal-500/50 outline-none transition-all pl-10">
                                            <i data-lucide="award" class="w-4 h-4 text-muted absolute left-3.5 top-1/2 -translate-y-1/2"></i>
                                        </div>
                                    </div>
                                    <div>
                                        <label class="block text-[10px] font-bold uppercase tracking-wider text-muted mb-1.5">Feedback</label>
                                        <textarea name="feedback" rows="2" th:text="${sub.feedback}" 
                                                  class="block w-full px-4 py-2.5 bg-background border border-subtle rounded-xl text-foreground text-sm focus:ring-2 focus:ring-teal-500/50 outline-none placeholder-muted-dark resize-y min-h-[80px] transition-all" 
                                                  placeholder="Constructive feedback..."></textarea>
                                    </div>
                                    <button type="submit" 
                                            th:classappend="${sub.grade != null ? 'bg-glass border border-teal-500/30 text-teal-400 hover:bg-teal-500/10' : 'bg-teal-600 hover:bg-teal-500 text-foreground border border-transparent'}"
                                            class="w-full py-2.5 text-sm font-bold rounded-xl transition-all flex items-center justify-center gap-2 shadow-sm">
                                        <i data-lucide="check" class="w-4 h-4"></i>
                                        <span th:text="${sub.grade != null ? 'Update Grade' : 'Save Grade'}">Save Grade</span>
                                    </button>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <footer th:replace="~{fragments :: footer}"></footer>
</body>
</html>
