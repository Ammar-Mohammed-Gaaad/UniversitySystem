<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments :: head('Messages — Creativa')}"></head>
<body class="bg-background text-foreground">
    <nav th:replace="~{fragments :: navbar}"></nav>
    <div class="min-h-screen pt-24 content-wrapper pb-16 px-4 md:pr-8">
        <div class="max-w-5xl mx-auto">
            <div th:if="${successMessage}" class="animate-fade-in-up bg-green-500/10 border border-green-500/30 text-green-400 p-4 rounded-2xl mb-8 flex items-center gap-3">
                <i data-lucide="check-circle" class="w-5 h-5"></i><span th:text="${successMessage}"></span>
            </div>
            <div class="flex items-center gap-3 mb-8">
                <div class="w-12 h-12 rounded-xl flex items-center justify-center bg-gradient-to-br from-pink-600 to-pink-800"><i data-lucide="mail" class="w-6 h-6 text-white"></i></div>
                <div><h1 class="text-3xl font-bold font-heading">Messages</h1><p class="text-sm text-muted">Send and receive direct messages</p></div>
            </div>
            <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
                <div class="lg:col-span-1">
                    <div class="glass rounded-3xl p-6 border border-subtle sticky top-24">
                        <h2 class="text-lg font-bold font-heading mb-6 flex items-center gap-2"><i data-lucide="pen-square" class="w-5 h-5 text-pink-400"></i> New Message</h2>
                        <form th:action="@{/messages/send}" method="post" class="space-y-4">
                            <div>
                                <label class="block text-xs font-medium text-secondary mb-1.5 uppercase tracking-wider">To</label>
                                <select name="receiverEmail" required class="w-full bg-card border border-subtle rounded-xl px-4 py-2.5 text-foreground focus:border-pink-500/50 outline-none">
                                    <option value="" disabled selected>-- Select --</option>
                                    <optgroup label="Students"><option th:each="s : ${students}" th:value="${s.email}" th:text="${s.name}"></option></optgroup>
                                    <optgroup label="Lecturers"><option th:each="l : ${lecturers}" th:value="${l.email}" th:text="${l.name}"></option></optgroup>
                                </select>
                            </div>
                            <div><textarea name="content" required rows="4" placeholder="Type your message..." class="w-full bg-card border border-subtle rounded-xl px-4 py-3 text-foreground placeholder-gray-600 focus:border-pink-500/50 outline-none resize-none"></textarea></div>
                            <button type="submit" class="w-full py-3 bg-gradient-to-r from-pink-600 to-pink-800 hover:from-pink-500 hover:to-pink-700 text-white rounded-xl font-bold transition-all flex justify-center items-center gap-2"><i data-lucide="send" class="w-4 h-4"></i> Send</button>
                        </form>
                    </div>
                </div>
                <div class="lg:col-span-2">
                    <!-- Messaging UI -->
                    <div class="glass rounded-3xl border border-subtle overflow-hidden flex flex-col h-[calc(100vh-12rem)] animate-fade-in-up">
                        <!-- Chat Header -->
                        <div class="p-4 border-b border-subtle bg-glass-subtle flex items-center justify-between">
                            <div class="flex items-center gap-3">
                                <div class="w-10 h-10 rounded-full bg-pink-600/20 flex items-center justify-center border border-pink-500/20">
                                    <i data-lucide="inbox" class="w-5 h-5 text-pink-400"></i>
                                </div>
                                <div>
                                    <h2 class="font-bold text-foreground">Message History</h2>
                                    <p class="text-[10px] text-pink-400 font-bold uppercase tracking-widest">Recent Conversations</p>
                                </div>
                            </div>
                            <div class="flex items-center gap-2">
                                <div class="w-2 h-2 rounded-full bg-green-500 animate-pulse"></div>
                                <span class="text-[10px] font-bold text-muted uppercase">Online</span>
                            </div>
                        </div>

                        <!-- Messages Area -->
                        <div id="messageArea" class="flex-1 overflow-y-auto p-6 space-y-6 bg-glass/5 custom-scrollbar">
                            <div th:each="msg : ${messages}" class="flex flex-col" th:classappend="${currentUserEmail == msg.senderEmail ? 'items-end' : 'items-start'}">
                                <div class="flex items-end gap-2 max-w-[85%] group">
                                    <div th:if="${currentUserEmail != msg.senderEmail}" class="w-8 h-8 rounded-full bg-pink-600/10 flex items-center justify-center shrink-0 border border-pink-500/20 text-[10px] font-bold text-pink-400" th:text="${#strings.substring(msg.senderName, 0, 1)}">S</div>
                                    
                                    <div class="flex flex-col" th:classappend="${currentUserEmail == msg.senderEmail ? 'items-end' : 'items-start'}">
                                        <div class="flex items-center gap-2 mb-1 px-1">
                                            <span class="text-[10px] font-bold text-muted-dark" th:text="${msg.senderName}">Name</span>
                                            <span class="text-[9px] text-muted-dark opacity-60" th:text="${#temporals.format(msg.sentAt, 'HH:mm')}">Time</span>
                                        </div>
                                        <div class="px-4 py-2.5 rounded-2xl shadow-sm text-sm"
                                             th:classappend="${currentUserEmail == msg.senderEmail ? 'bg-pink-600 text-white rounded-br-none' : 'bg-glass border border-subtle text-foreground rounded-bl-none'}">
                                            <p th:text="${msg.content}">Message content</p>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <div th:if="${#lists.isEmpty(messages)}" class="h-full flex flex-col items-center justify-center text-center opacity-30">
                                <i data-lucide="messages-square" class="w-16 h-16 mb-4"></i>
                                <p class="font-heading text-lg">No messages yet.</p>
                                <p class="text-xs">Start the conversation using the form on the left!</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <footer th:replace="~{fragments :: footer}"></footer>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const area = document.getElementById('messageArea');
            if (area) area.scrollTop = area.scrollHeight;
        });
    </script>
</body>
</html>
