<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head th:replace="~{fragments :: head('My Exams — Creativa')}"></head>

<body class="bg-background text-foreground">
    <nav th:replace="~{fragments :: navbar}"></nav>
    <div th:replace="~{fragments :: toasts}"></div>

    <div class="min-h-screen pt-24 content-wrapper pb-16 px-4 md:pr-8">
        <div class="max-w-7xl mx-auto">
            
            <div th:if="${successMessage}" data-toast class="animate-fade-in-up bg-green-500/10 border border-green-500/30 text-green-400 p-4 rounded-2xl mb-6 flex items-center gap-3">
                <i data-lucide="check-circle" class="w-5 h-5 flex-shrink-0"></i>
                <span class="font-medium" th:text="${successMessage}">Success!</span>
            </div>
            
            <div th:if="${errorMessage}" data-toast class="animate-fade-in-up bg-red-500/10 border border-red-500/30 text-red-400 p-4 rounded-2xl mb-6 flex items-center gap-3">
                <i data-lucide="alert-circle" class="w-5 h-5 flex-shrink-0"></i>
                <span class="font-medium" th:text="${errorMessage}">Error!</span>
            </div>

            <!-- Header -->
            <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-8">
                <div>
                    <a th:href="@{/student/dashboard}" class="inline-flex items-center gap-2 text-sm text-muted hover:text-foreground transition-colors mb-2">
                        <i data-lucide="arrow-left" class="w-4 h-4"></i> Back to Dashboard
                    </a>
                    <h1 class="text-3xl font-bold font-heading">
                        Exams <span class="text-teal-400" th:text="${course.coursecode}">CODE</span>
                    </h1>
                </div>
            </div>

            <div class="glass rounded-2xl border border-subtle overflow-hidden">
                <div class="p-6 border-b border-subtle flex items-center justify-between">
                    <h2 class="text-xl font-bold font-heading flex items-center gap-2">
                        <i data-lucide="file-question" class="w-5 h-5 text-teal-400"></i> Available Exams
                    </h2>
                </div>
                
                <div th:if="${#lists.isEmpty(exams)}" class="p-12 text-center">
                    <i data-lucide="inbox" class="w-12 h-12 text-muted-dark mx-auto mb-4"></i>
                    <h3 class="text-lg font-medium text-foreground">No exams available</h3>
                    <p class="text-muted text-sm mt-1">There are no exams scheduled for this course yet.</p>
                </div>

                <div th:if="${!#lists.isEmpty(exams)}" class="p-6 space-y-4">
                    <div th:each="exam : ${exams}" th:if="${exam.status.name() != 'DRAFT'}" class="glass rounded-2xl p-5 border border-subtle flex flex-col sm:flex-row sm:items-center justify-between gap-4 transition-colors hover:border-teal-500/30">
                        <div>
                            <div class="flex items-center gap-2 mb-1">
                                <h3 class="font-bold text-foreground text-lg" th:text="${exam.title}">Exam Title</h3>
                                <span th:if="${submissionMap.get(exam.id) != null}" class="px-2 py-0.5 rounded text-[10px] font-bold uppercase tracking-wider bg-green-500/10 text-green-400 border border-green-500/20">Completed</span>
                                <span th:if="${submissionMap.get(exam.id) == null}" class="px-2 py-0.5 rounded text-[10px] font-bold uppercase tracking-wider bg-amber-500/10 text-amber-400 border border-amber-500/20">Pending</span>
                            </div>
                            <p class="text-sm text-muted mb-2 flex items-center gap-2">
                                <i data-lucide="clock" class="w-3.5 h-3.5"></i> <span th:text="${exam.durationMinutes} + ' mins'">60 mins</span>
                                <i data-lucide="calendar" class="w-3.5 h-3.5 ml-2"></i> <span class="exam-start-time" th:data-start="${exam.startTime}" th:text="${#temporals.format(exam.startTime, 'dd MMM yyyy, HH:mm')}">Date</span>
                                <span class="exam-countdown ml-2 px-2 py-0.5 rounded text-[10px] font-bold bg-glass border border-subtle hidden"></span>
                            </p>
                            <p class="text-sm text-secondary" th:if="${exam.description != null && !exam.description.isEmpty()}" th:text="${exam.description}">Description</p>
                        </div>
                        
                        <div class="flex-shrink-0 min-w-[140px]">
                            <div th:if="${submissionMap.get(exam.id) != null}" class="text-center p-3 rounded-xl bg-glass-subtle border border-subtle flex items-center justify-center gap-4">
                                <div>
                                    <p class="text-xs text-muted mb-1">Your Score</p>
                                    <p class="text-xl font-bold font-heading" 
                                       th:classappend="${(submissionMap.get(exam.id).score * 1.0 / submissionMap.get(exam.id).totalPossibleScore) >= 0.5} ? 'text-green-400' : 'text-red-400'">
                                        <span th:text="${submissionMap.get(exam.id).score}">10</span> / <span th:text="${submissionMap.get(exam.id).totalPossibleScore}">10</span>
                                    </p>
                                </div>
                                <div class="relative w-12 h-12">
                                    <!-- Background circle -->
                                    <svg class="w-12 h-12 transform -rotate-90">
                                        <circle cx="24" cy="24" r="20" stroke="currentColor" stroke-width="4" fill="transparent" class="text-subtle" />
                                        <circle cx="24" cy="24" r="20" stroke="currentColor" stroke-width="4" fill="transparent"
                                                th:classappend="${(submissionMap.get(exam.id).score * 1.0 / submissionMap.get(exam.id).totalPossibleScore) >= 0.5} ? 'text-green-500' : 'text-red-500'"
                                                th:stroke-dasharray="${2 * 3.14159 * 20}"
                                                th:stroke-dashoffset="${2 * 3.14159 * 20 * (1 - (submissionMap.get(exam.id).score * 1.0 / submissionMap.get(exam.id).totalPossibleScore))}"
                                                class="transition-all duration-1000 ease-out" />
                                    </svg>
                                </div>
                            </div>
                            
                            <a th:if="${submissionMap.get(exam.id) == null}" th:href="@{/student/exam/{id}/take(id=${exam.id})}" class="block w-full text-center px-4 py-3 rounded-xl bg-teal-600 hover:bg-teal-700 text-white font-medium transition-all shadow-[0_0_15px_rgba(15,118,110,0.3)]">
                                Take Exam
                            </a>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <footer th:replace="~{fragments :: footer}"></footer>

    <script>
        // Exam countdown
        document.querySelectorAll('.exam-start-time').forEach(el => {
            const startAttr = el.getAttribute('data-start');
            if(!startAttr) return;
            const startDate = new Date(startAttr);
            const now = new Date();
            const diffMs = startDate - now;
            const badge = el.parentElement.querySelector('.exam-countdown');
            
            if(diffMs > 0 && badge) {
                const diffDays = Math.floor(diffMs / (1000 * 60 * 60 * 24));
                const diffHours = Math.floor((diffMs % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const diffMins = Math.floor((diffMs % (1000 * 60 * 60)) / (1000 * 60));
                badge.classList.remove('hidden');
                if(diffDays > 0) {
                    badge.textContent = diffDays + 'd ' + diffHours + 'h left';
                    badge.classList.add('text-teal-400', 'border-teal-500/30', 'bg-teal-500/10');
                } else if(diffHours > 0) {
                    badge.textContent = diffHours + 'h ' + diffMins + 'm left';
                    badge.classList.add('text-amber-400', 'border-amber-500/30', 'bg-amber-500/10');
                } else {
                    badge.textContent = 'Starts in ' + diffMins + 'm';
                    badge.classList.add('text-red-400', 'border-red-500/30', 'bg-red-500/10', 'animate-pulse');
                }
            } else if (diffMs <= 0 && badge) {
                badge.classList.remove('hidden');
                badge.textContent = 'Active Now';
                badge.classList.add('text-green-400', 'border-green-500/50', 'bg-green-500/20', 'animate-pulse');
            }
        });
    </script>
</body>
</html>
