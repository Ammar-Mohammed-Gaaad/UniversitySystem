<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head th:replace="~{fragments :: head('My Attendance — Creativa')}"></head>

<body class="bg-background text-foreground">
    <nav th:replace="~{fragments :: navbar}"></nav>
    <div th:replace="~{fragments :: toasts}"></div>

    <div class="min-h-screen pt-24 content-wrapper pb-16 px-4 md:pr-8">
        <div class="max-w-7xl mx-auto">
            
            <!-- Header -->
            <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-8">
                <div>
                    <a th:href="@{/student/dashboard}" class="inline-flex items-center gap-2 text-sm text-muted hover:text-foreground transition-colors mb-2">
                        <i data-lucide="arrow-left" class="w-4 h-4"></i> Back to Dashboard
                    </a>
                    <h1 class="text-3xl font-bold font-heading">
                        My Attendance <span class="text-teal-400" th:text="${course.coursecode}">CODE</span>
                    </h1>
                </div>
            </div>

            <!-- Stats -->
            <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-8">
                <div class="glass rounded-2xl p-5 border border-subtle flex flex-col items-center justify-center text-center">
                    <p class="text-3xl font-bold text-teal-400 font-heading mb-1" th:text="${attendancePercentage + '%'}">100%</p>
                    <p class="text-sm text-secondary">Overall Rate</p>
                </div>
                <div class="glass rounded-2xl p-5 border border-subtle flex flex-col items-center justify-center text-center">
                    <p class="text-2xl font-bold text-green-400 font-heading mb-1" th:text="${presentCount}">0</p>
                    <p class="text-sm text-secondary">Present</p>
                </div>
                <div class="glass rounded-2xl p-5 border border-subtle flex flex-col items-center justify-center text-center">
                    <p class="text-2xl font-bold text-red-400 font-heading mb-1" th:text="${absentCount}">0</p>
                    <p class="text-sm text-secondary">Absent</p>
                </div>
                <div class="glass rounded-2xl p-5 border border-subtle flex flex-col items-center justify-center text-center">
                    <p class="text-2xl font-bold text-amber-400 font-heading mb-1" th:text="${excusedCount}">0</p>
                    <p class="text-sm text-secondary">Excused</p>
                </div>
            </div>

            <!-- History Table -->
            <div class="glass rounded-2xl border border-subtle overflow-hidden">
                <div class="p-6 border-b border-subtle">
                    <h2 class="text-xl font-bold font-heading flex items-center gap-2">
                        <i data-lucide="history" class="w-5 h-5 text-teal-400"></i> Attendance History
                    </h2>
                </div>
                
                <div th:if="${#lists.isEmpty(myAttendance)}" class="p-12 text-center">
                    <i data-lucide="calendar-x" class="w-12 h-12 text-muted-dark mx-auto mb-4"></i>
                    <h3 class="text-lg font-medium text-foreground">No attendance recorded yet</h3>
                    <p class="text-muted text-sm mt-1">Your lecturer hasn't marked any attendance for this course.</p>
                </div>

                <div th:if="${!#lists.isEmpty(myAttendance)}" class="overflow-x-auto">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="bg-glass-subtle border-b border-subtle">
                                <th class="py-4 px-6 font-semibold text-secondary text-sm">Date</th>
                                <th class="py-4 px-6 font-semibold text-secondary text-sm">Schedule</th>
                                <th class="py-4 px-6 font-semibold text-secondary text-sm">Status</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="a : ${myAttendance}" class="border-b border-subtle/50 hover:bg-glass/50 transition-colors">
                                <td class="py-4 px-6 text-sm text-foreground font-medium" th:text="${#temporals.format(a.date, 'dd MMM yyyy')}">01 Jan 2026</td>
                                <td class="py-4 px-6 text-sm text-foreground" th:text="${a.schedule.dayOfWeek + ' ' + a.schedule.startTime + '-' + a.schedule.endTime}">Monday 10:00-11:30</td>
                                <td class="py-4 px-6">
                                    <span th:if="${a.status.name() == 'PRESENT'}" class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-green-500/10 border border-green-500/20 text-green-400 text-xs font-bold uppercase">
                                        <i data-lucide="check" class="w-3.5 h-3.5"></i> Present
                                    </span>
                                    <span th:if="${a.status.name() == 'ABSENT'}" class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-red-500/10 border border-red-500/20 text-red-400 text-xs font-bold uppercase">
                                        <i data-lucide="x" class="w-3.5 h-3.5"></i> Absent
                                    </span>
                                    <span th:if="${a.status.name() == 'EXCUSED'}" class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-amber-500/10 border border-amber-500/20 text-amber-400 text-xs font-bold uppercase">
                                        <i data-lucide="minus" class="w-3.5 h-3.5"></i> Excused
                                    </span>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

        </div>
    </div>

    <footer th:replace="~{fragments :: footer}"></footer>
</body>
</html>
