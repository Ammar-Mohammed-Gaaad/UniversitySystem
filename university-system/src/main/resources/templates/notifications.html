<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments :: head('Notifications — Creativa')}"></head>

<body class="bg-background text-foreground">
    <nav th:replace="~{fragments :: navbar}"></nav>

    <div class="min-h-screen pt-24 content-wrapper pb-16 px-4 md:pr-8">
        <div class="max-w-4xl mx-auto">

            <!-- Header -->
            <div class="flex items-center justify-between gap-6 mb-10 animate-fade-in-up">
                <div class="flex items-center gap-3">
                    <div class="w-12 h-12 rounded-xl flex items-center justify-center bg-gradient-to-br from-pink-600 to-pink-800 shadow-[0_0_20px_rgba(219,39,119,0.3)]">
                        <i data-lucide="bell" class="w-6 h-6 text-white"></i>
                    </div>
                    <div>
                        <h1 class="text-3xl font-bold font-heading">Notifications</h1>
                        <p class="text-sm text-muted mt-0.5">Stay updated with the latest university news</p>
                    </div>
                </div>
                <form th:action="@{/notifications/read-all}" method="post">
                    <button type="submit" class="hidden sm:flex items-center gap-2 px-4 py-2 rounded-xl bg-glass border border-subtle hover:border-pink-500/30 text-xs font-bold text-muted hover:text-foreground transition-all">
                        <i data-lucide="check-check" class="w-4 h-4"></i>
                        Mark All as Read
                    </button>
                </form>
            </div>

            <!-- Notification List -->
            <div class="glass rounded-3xl border border-subtle overflow-hidden animate-fade-in-up delay-100">
                <div th:if="${#lists.isEmpty(notifications)}" class="p-24 text-center">
                    <i data-lucide="bell-off" class="w-16 h-16 text-muted-dark mx-auto mb-4 opacity-20"></i>
                    <h3 class="text-xl font-bold font-heading text-foreground mb-2">Inbox Clean!</h3>
                    <p class="text-muted">You're all caught up with your notifications.</p>
                </div>

                <div th:if="${!#lists.isEmpty(notifications)}" class="divide-y divide-subtle">
                    <div th:each="n : ${notifications}" class="p-6 hover:bg-glass transition-colors group">
                        <div class="flex gap-4">

                            <!-- Content -->
                            <div class="flex-1">
                                <div class="flex items-start justify-between gap-4 mb-1">
                                    <h4 class="font-bold text-foreground" th:classappend="${!notif.read ? 'text-teal-300' : ''}" th:text="${notif.title}">Notification Title</h4>
                                    <span class="text-xs text-muted-dark whitespace-nowrap" th:text="${#temporals.format(notif.createdAt, 'dd MMM, HH:mm')}">Time</span>
                                </div>
                                <p class="text-sm text-muted" th:text="${notif.message}">Notification content goes here...</p>
                                
                                <form th:if="${!notif.read}" th:action="@{/notifications/{id}/read(id=${notif.id})}" method="post" class="mt-3 m-0">
                                    <button type="submit" class="text-xs font-semibold text-teal-400 hover:text-teal-300 transition-colors flex items-center gap-1.5">
                                        <i data-lucide="check" class="w-3.5 h-3.5"></i> Mark as read
                                    </button>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <footer th:replace="~{fragments :: footer}"></footer>
</body>
</html>
