<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments :: head('Notifications â€” Creativa')}"></head>

<body class="bg-background text-foreground">
    <nav th:replace="~{fragments :: navbar}"></nav>

    <div class="min-h-screen pt-24 content-wrapper pb-16 px-4 md:pr-8">
        <div class="max-w-4xl mx-auto">

            <!-- Header -->
            <div class="mb-8 flex items-center justify-between">
                <div class="flex items-center gap-4">
                    <div class="w-12 h-12 bg-teal-600/20 rounded-xl flex items-center justify-center border border-teal-500/30">
                        <i data-lucide="bell" class="w-6 h-6 text-teal-400"></i>
                    </div>
                    <div>
                        <h1 class="text-3xl font-bold font-heading">Notifications</h1>
                        <p class="text-muted text-sm mt-1">Updates and alerts for your account.</p>
                    </div>
                </div>
            </div>

            <div class="glass rounded-3xl border border-subtle overflow-hidden">
                <div th:if="${#lists.isEmpty(notifications)}" class="p-16 text-center">
                    <div class="w-20 h-20 bg-glass rounded-3xl flex items-center justify-center mx-auto mb-6">
                        <i data-lucide="bell-off" class="w-10 h-10 text-muted-dark"></i>
                    </div>
                    <h3 class="text-xl font-bold text-foreground mb-2">No Notifications</h3>
                    <p class="text-muted">You're all caught up! There are no new notifications.</p>
                </div>

                <div th:if="${!#lists.isEmpty(notifications)}" class="divide-y divide-white/5">
                    <div th:each="notif : ${notifications}" class="p-6 transition-colors" th:classappend="${!notif.read ? 'bg-teal-600/[0.05] hover:bg-teal-600/[0.08]' : 'hover:bg-glass-subtle'}">
                        <div class="flex gap-4">
                            <!-- Icon -->
                            <div class="w-10 h-10 rounded-full flex items-center justify-center flex-shrink-0"
                                 th:classappend="${notif.type == 'SUCCESS' ? 'bg-green-500/20 text-green-400' : (notif.type == 'ERROR' ? 'bg-red-500/20 text-red-400' : (notif.type == 'WARNING' ? 'bg-amber-500/20 text-amber-400' : 'bg-blue-500/20 text-blue-400'))}">
                                <i data-lucide="info" th:if="${notif.type == 'INFO' || notif.type == null}" class="w-5 h-5"></i>
                                <i data-lucide="check-circle" th:if="${notif.type == 'SUCCESS'}" class="w-5 h-5"></i>
                                <i data-lucide="alert-triangle" th:if="${notif.type == 'WARNING'}" class="w-5 h-5"></i>
                                <i data-lucide="x-circle" th:if="${notif.type == 'ERROR'}" class="w-5 h-5"></i>
                            </div>

                            <!-- Content -->
                            <div class="flex-1">
                                <div class="flex items-start justify-between gap-4 mb-1">
                                    <h4 class="font-bold text-foreground" th:classappend="${!notif.read ? 'text-teal-300' : ''}" th:text="${notif.title}">Notification Title</h4>
                                    <span class="text-xs text-muted-dark whitespace-nowrap" th:text="${#temporals.format(notif.createdAt, 'dd MMM, HH:mm')}">Time</span>
                                </div>
                                <p class="text-sm text-muted" th:text="${notif.message}">Notification content goes here...</p>
                                
                                <form th:if="${!notif.read}" th:action="@{/notifications/{id}/read(id=${notif.id})}" method="post" class="mt-3 m-0">
                                    <button type="submit" class="text-xs font-semibold text-teal-400 hover:text-teal-300 transition-colors flex items-center gap-1.5">
                                        <i data-lucide="check" class="w-3.5 h-3.5"></i> Mark as read
                                    </button>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <footer th:replace="~{fragments :: footer}"></footer>
</body>
</html>
