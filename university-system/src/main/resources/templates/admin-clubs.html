<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Manage Clubs — Creativa')}"></head>
<body class="bg-background text-foreground relative">
    <nav th:replace="~{fragments :: navbar}"></nav>
    <div class="fixed inset-0 overflow-hidden pointer-events-none -z-10">
        <div class="absolute top-1/4 right-1/4 w-[400px] h-[400px] rounded-full bg-orange-600/5 blur-[120px] animate-float"></div>
    </div>
    <div class="min-h-screen pt-24 content-wrapper pb-16 px-4 md:pr-8">
        <div class="max-w-5xl mx-auto">
            <div th:if="${successMessage}" class="animate-fade-in-up bg-green-500/10 border border-green-500/30 text-green-400 p-4 rounded-2xl mb-8 flex items-center gap-3">
                <i data-lucide="check-circle" class="w-5 h-5"></i><span th:text="${successMessage}"></span>
            </div>
            <div class="flex items-center gap-3 mb-8">
                <div class="w-12 h-12 rounded-xl flex items-center justify-center bg-gradient-to-br from-orange-600 to-orange-800"><i data-lucide="trophy" class="w-6 h-6 text-white"></i></div>
                <div><h1 class="text-3xl font-bold font-heading">Manage Clubs</h1><p class="text-sm text-muted">Create and manage student organizations</p></div>
            </div>
            <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
                <div class="lg:col-span-1">
                    <div class="glass rounded-3xl p-6 border border-subtle sticky top-24">
                        <h2 class="text-lg font-bold font-heading mb-6 flex items-center gap-2"><i data-lucide="plus-circle" class="w-5 h-5 text-orange-400"></i> Create Club</h2>
                        <form th:action="@{/admin/clubs/create}" method="post" class="space-y-4">
                            <div>
                                <label class="block text-xs font-medium text-secondary mb-1.5 uppercase tracking-wider">Club Name</label>
                                <input type="text" name="name" required placeholder="e.g. Robotics Club" class="w-full bg-card border border-subtle rounded-xl px-4 py-2.5 text-foreground placeholder-gray-600 focus:border-orange-500/50 outline-none">
                            </div>
                            <div>
                                <label class="block text-xs font-medium text-secondary mb-1.5 uppercase tracking-wider">Description</label>
                                <textarea name="description" rows="3" required placeholder="What is this club about?" class="w-full bg-card border border-subtle rounded-xl px-4 py-2.5 text-foreground placeholder-gray-600 focus:border-orange-500/50 outline-none resize-none"></textarea>
                            </div>
                            <div>
                                <label class="block text-xs font-medium text-secondary mb-1.5 uppercase tracking-wider">Category</label>
                                <input type="text" name="category" required placeholder="e.g. Technology, Sports, Arts" class="w-full bg-card border border-subtle rounded-xl px-4 py-2.5 text-foreground placeholder-gray-600 focus:border-orange-500/50 outline-none">
                            </div>
                            <button type="submit" class="w-full py-3 bg-gradient-to-r from-orange-600 to-orange-800 hover:from-orange-500 hover:to-orange-700 text-white rounded-xl font-bold transition-all flex justify-center items-center gap-2"><i data-lucide="plus" class="w-4 h-4"></i> Create Club</button>
                        </form>
                    </div>
                </div>
                <div class="lg:col-span-2">
                    <div class="glass rounded-3xl p-6 border border-subtle">
                        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-6">
                            <h3 class="text-lg font-bold font-heading flex items-center gap-2">
                                <i data-lucide="list" class="w-5 h-5 text-orange-400"></i> All Clubs
                            </h3>
                            <div class="relative">
                                <input type="text" id="clubSearch" placeholder="Search clubs..." class="w-full bg-background border border-subtle rounded-xl px-4 py-2 pl-9 text-xs text-foreground placeholder-muted-dark focus:border-orange-500/50 outline-none transition w-48 lg:w-64">
                                <i data-lucide="search" class="w-3.5 h-3.5 text-muted absolute left-3 top-1/2 -translate-y-1/2"></i>
                            </div>
                        </div>

                        <!-- Category Filter Chips -->
                        <div class="flex flex-wrap gap-2 mb-6">
                            <button onclick="filterClubs('ALL')" class="club-filter-btn active px-3 py-1 rounded-full text-[10px] font-bold border border-subtle bg-glass hover:border-orange-500/30 transition-all" data-category="ALL">ALL</button>
                            <button th:each="cat : ${categories}" th:onclick="'filterClubs(\'' + ${cat} + '\')'" 
                                    class="club-filter-btn px-3 py-1 rounded-full text-[10px] font-bold border border-subtle bg-glass hover:border-orange-500/30 transition-all" 
                                    th:data-category="${cat}" th:text="${#strings.toUpperCase(cat)}">CAT</button>
                        </div>

                        <div th:if="${#lists.isEmpty(clubs)}" class="p-12 text-center text-muted border border-dashed border-subtle rounded-2xl">
                            <i data-lucide="flag-off" class="w-12 h-12 mx-auto mb-4 opacity-20"></i>
                            <p>No clubs created yet. Start by creating one.</p>
                        </div>

                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4" id="clubsList" th:if="${!#lists.isEmpty(clubs)}">
                            <div th:each="club : ${clubs}" class="club-card group relative p-4 rounded-2xl bg-glass border border-subtle hover:border-orange-500/30 transition-all card-hover" th:data-category="${club.category}">
                                <div class="flex items-start justify-between mb-4">
                                    <div class="w-10 h-10 rounded-xl bg-orange-500/10 flex items-center justify-center border border-orange-500/20 group-hover:border-orange-500/40 transition-all">
                                        <i data-lucide="flag" class="w-5 h-5 text-orange-400"></i>
                                    </div>
                                    <form th:action="@{/admin/clubs/delete/{id}(id=${club.id})}" method="post" onsubmit="return confirm('Are you sure you want to delete this club?')">
                                        <button type="submit" class="p-1.5 rounded-lg text-muted hover:text-red-400 hover:bg-red-500/10 transition-all">
                                            <i data-lucide="trash-2" class="w-4 h-4"></i>
                                        </button>
                                    </form>
                                </div>
                                <a th:href="@{/club/{id}(id=${club.id})}" class="block">
                                    <h4 class="font-bold text-foreground group-hover:text-orange-400 transition-colors mb-1" th:text="${club.name}">Club Name</h4>
                                    <p class="text-[10px] text-muted-dark uppercase tracking-wider font-bold mb-4" th:text="${club.category}">Category</p>
                                    
                                    <div class="flex items-center gap-4">
                                        <div class="flex items-center gap-1.5">
                                            <i data-lucide="users" class="w-3.5 h-3.5 text-teal-400"></i>
                                            <span class="text-xs font-bold text-teal-400" th:text="${club.members != null ? club.members.size() : 0}">0</span>
                                            <span class="text-[10px] text-muted-dark uppercase">Members</span>
                                        </div>
                                        <div class="flex items-center gap-1.5">
                                            <i data-lucide="calendar" class="w-3.5 h-3.5 text-blue-400"></i>
                                            <span class="text-xs font-bold text-blue-400">0</span>
                                            <span class="text-[10px] text-muted-dark uppercase">Events</span>
                                        </div>
                                    </div>
                                </a>
                            </div>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>
    <footer th:replace="~{fragments :: footer}"></footer>
    <script>
        function filterClubs(category) {
            // Update buttons
            document.querySelectorAll('.club-filter-btn').forEach(btn => {
                btn.classList.remove('active', 'bg-orange-500/10', 'text-orange-400', 'border-orange-500/30');
                if (btn.getAttribute('data-category') === category) {
                    btn.classList.add('active', 'bg-orange-500/10', 'text-orange-400', 'border-orange-500/30');
                }
            });

            // Filter cards
            document.querySelectorAll('.club-card').forEach(card => {
                const cardCat = card.getAttribute('data-category');
                const searchTerm = document.getElementById('clubSearch').value.toLowerCase();
                const matchesCat = category === 'ALL' || cardCat === category;
                const matchesSearch = card.textContent.toLowerCase().includes(searchTerm);

                card.style.display = (matchesCat && matchesSearch) ? '' : 'none';
            });
        }

        document.addEventListener('DOMContentLoaded', () => {
            const s = document.getElementById('clubSearch');
            if (s) s.addEventListener('input', () => {
                const activeCat = document.querySelector('.club-filter-btn.active').getAttribute('data-category');
                filterClubs(activeCat);
            });
        });
    </script>
</body>
</html>
