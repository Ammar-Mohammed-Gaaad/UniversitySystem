<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head th:replace="~{fragments :: head('Thread — Creativa')}"></head>

<body class="bg-background text-foreground">
    <nav th:replace="~{fragments :: navbar}"></nav>
    <div th:replace="~{fragments :: toasts}"></div>

    <div class="min-h-screen pt-24 content-wrapper pb-16 px-4 md:pr-8">
        <div class="max-w-4xl mx-auto">

            <div th:if="${successMessage}" data-toast class="animate-fade-in-up bg-green-500/10 border border-green-500/30 text-green-400 p-4 rounded-2xl mb-8 flex items-center gap-3">
                <i data-lucide="check-circle" class="w-5 h-5 flex-shrink-0"></i>
                <span class="font-medium" th:text="${successMessage}">Success!</span>
            </div>

            <!-- Back -->
            <a th:href="@{/course/{id}/forum(id=${course.id})}" class="inline-flex items-center gap-2 px-4 py-2 rounded-xl text-sm font-medium text-muted hover:text-foreground hover:bg-glass transition-all mb-6">
                <i data-lucide="arrow-left" class="w-4 h-4"></i> Back to Forum
            </a>

            <!-- Original Post -->
            <div class="glass rounded-3xl p-8 border border-subtle mb-8 relative overflow-hidden">
                <div class="absolute top-0 left-0 bottom-0 w-1.5 bg-gradient-to-b from-violet-500 to-violet-700"></div>
                <h1 class="text-2xl font-bold font-heading mb-4 pl-4" th:text="${thread.title}">Thread Title</h1>
                <p class="text-foreground whitespace-pre-wrap pl-4 mb-6" th:text="${thread.content}">Content</p>
                <div class="flex items-center gap-3 pl-4">
                    <div class="w-10 h-10 rounded-full bg-violet-600/20 flex items-center justify-center">
                        <i data-lucide="user" class="w-5 h-5 text-violet-400"></i>
                    </div>
                    <div>
                        <p class="font-medium text-foreground" th:text="${thread.authorName}">Author</p>
                        <p class="text-xs text-muted-dark" th:text="${#temporals.format(thread.createdAt, 'dd MMM yyyy, HH:mm')}">Date</p>
                    </div>
                </div>
            </div>

            <!-- Replies -->
            <h2 class="text-xl font-bold font-heading mb-4 flex items-center gap-2">
                <i data-lucide="message-circle" class="w-5 h-5 text-violet-400"></i>
                Replies <span class="text-sm font-normal text-muted" th:text="'(' + ${thread.replies != null ? thread.replies.size() : 0} + ')'"></span>
            </h2>

            <div class="space-y-4 mb-8">
                <div th:each="reply : ${thread.replies}" class="glass rounded-2xl p-6 border border-subtle">
                    <p class="text-foreground whitespace-pre-wrap mb-4" th:text="${reply.content}">Reply content</p>
                    <div class="flex items-center gap-3">
                        <div class="w-8 h-8 rounded-full bg-teal-600/20 flex items-center justify-center">
                            <i data-lucide="user" class="w-4 h-4 text-teal-400"></i>
                        </div>
                        <div>
                            <p class="font-medium text-sm text-foreground" th:text="${reply.authorName}">Author</p>
                            <p class="text-xs text-muted-dark" th:text="${#temporals.format(reply.createdAt, 'dd MMM yyyy, HH:mm')}">Date</p>
                        </div>
                    </div>
                </div>

                <div th:if="${thread.replies == null || thread.replies.isEmpty()}" class="glass rounded-2xl p-8 text-center border border-subtle">
                    <p class="text-muted text-sm">No replies yet. Be the first to respond!</p>
                </div>
            </div>

            <!-- Reply Form -->
            <div sec:authorize="isAuthenticated()" class="glass rounded-3xl p-6 border border-subtle">
                <h3 class="font-bold font-heading mb-4 flex items-center gap-2">
                    <i data-lucide="reply" class="w-5 h-5 text-teal-400"></i> Write a Reply
                </h3>
                <form th:action="@{/forum/thread/{id}/reply(id=${thread.id})}" method="post" class="space-y-4">
                    <textarea name="content" required rows="4" placeholder="Type your reply..." class="w-full bg-card border border-subtle rounded-xl px-4 py-3 text-foreground placeholder-gray-600 focus:border-teal-500/50 focus:ring-1 focus:ring-teal-500/50 outline-none resize-none"></textarea>
                    <button type="submit" class="px-6 py-2.5 bg-gradient-to-r from-teal-600 to-teal-800 hover:from-teal-500 hover:to-teal-700 text-white rounded-xl font-bold transition-all shadow-[0_0_15px_rgba(15,118,110,0.3)] flex items-center gap-2">
                        <i data-lucide="send" class="w-4 h-4"></i> Post Reply
                    </button>
                </form>
            </div>
        </div>
    </div>

    <footer th:replace="~{fragments :: footer}"></footer>
</body>
</html>
